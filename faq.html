<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>FAQ &amp; Troubleshooting &mdash; Lynx Support</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
:root{--bg:#FFFFFF;--bg-card:#FFFFFF;--bg-section:#EAE0F2;--gold:#E8A800;--ink:#111;--ink-2:#333;--ink-3:#555;--ink-4:#666;--ink-5:#888;--ink-6:#aaa;--nav-bg:#2d004f;--border:#C7C7C7;--border-row:rgba(0,0,0,.16);--purple:#55009C}
html{background:var(--bg)}body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:15px;min-height:100vh;display:flex;flex-direction:column}
.hdr{background:var(--nav-bg);border-bottom:3px solid var(--gold);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:14px}
.logo img{height:32px;width:auto;display:block}
.logo-divider{width:1px;height:24px;background:rgba(255,255,255,.2)}
.crumbs{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#fff;letter-spacing:.3px;text-transform:uppercase}
.crumb-link{opacity:.55;text-decoration:none;color:inherit;transition:opacity .15s}
.crumb-link:hover{opacity:1}
.crumb-sep{opacity:.35;font-weight:400;font-size:15px}
.crumb-current{opacity:.95}
.hdr-right{display:flex;align-items:center;gap:14px}
.hdr-beta{background:var(--gold);color:#111;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:4px 10px;border:1px solid var(--border)}

/* Layout */
.wrap{max-width:1900px;margin:0 auto;padding:24px 24px 64px;width:100%;flex:1}
.page-header{margin-bottom:20px}
.page-title{font-size:28px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
.page-sub{font-size:14px;color:var(--ink-4);line-height:1.5}

/* Search */
.faq-search{width:100%;background:var(--bg-card);border:2px solid var(--border);padding:10px 16px;font-family:inherit;font-size:15px;color:var(--ink);outline:none;margin-bottom:16px;transition:border-color .15s}
.faq-search:focus{border-color:var(--gold)}
.faq-search::placeholder{color:var(--ink-5)}

/* Type filter tabs */
.faq-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px}
.faq-tab{background:var(--bg-card);border:1.5px solid var(--border);color:var(--ink);font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:6px 12px;cursor:pointer;transition:background .12s}
.faq-tab:hover{background:var(--bg-section)}
.faq-tab.active{background:var(--ink);color:var(--bg-card)}
.faq-tab .tab-count{font-family:'JetBrains Mono',monospace;font-size:10px;opacity:.55;margin-left:4px}

/* FAQ entry — type-colored left border, brand palette badges */
.faq-entry{--type-color:var(--ink-6);border:1px solid var(--border-row);border-left:4px solid var(--type-color);margin-bottom:8px;background:var(--bg-card);overflow:hidden;transition:border-color .15s}
.faq-entry.troubleshooting{--type-color:#c62828}
.faq-entry.tip{--type-color:#E8A800}
.faq-entry.reference{--type-color:#4A5568}
.faq-entry.workflow{--type-color:#55009C}
.faq-entry.integration{--type-color:#1A6B6B}
.faq-entry.networking{--type-color:#2C7A7A}
.faq-header{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;user-select:none;transition:background .12s}
.faq-header:hover{background:var(--bg-section)}
.faq-entry:hover{border-color:var(--type-color)}
.faq-chevron{flex-shrink:0;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--ink-5);transition:transform .2s}
.faq-entry.open .faq-chevron{transform:rotate(90deg)}
.faq-badge{flex-shrink:0;font-size:8px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:2px 6px;border:1.5px solid var(--border);color:var(--ink-4);white-space:nowrap}
.faq-badge.troubleshooting{background:#c62828;color:#fff;border-color:#c62828}
.faq-badge.tip{background:#E8A800;color:#111;border-color:#E8A800}
.faq-badge.reference{background:#4A5568;color:#fff;border-color:#4A5568}
.faq-badge.workflow{background:#55009C;color:#fff;border-color:#55009C}
.faq-badge.integration{background:#1A6B6B;color:#fff;border-color:#1A6B6B}
.faq-badge.networking{background:#2C7A7A;color:#fff;border-color:#2C7A7A}
.faq-title{font-size:14px;font-weight:700;color:var(--ink);flex:1}
.faq-body{display:none;padding:0 16px 16px 44px;font-size:13px;line-height:1.7;color:var(--ink-2);max-width:80ch}
.faq-entry.open .faq-body{display:block}
.faq-body ul,.faq-body ol{margin:8px 0;padding-left:20px}
.faq-body li{margin-bottom:6px}
.faq-body code{font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--bg-section);padding:1px 5px;border-radius:2px}
.faq-body strong{color:var(--ink);font-weight:700}
.faq-section-label{font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--ink-5);padding:16px 0 8px;border-bottom:2px solid var(--border);margin-bottom:8px}

/* Empty state */
.empty{text-align:center;padding:40px 24px;color:var(--ink-5);font-size:14px}


footer{border-top:2px solid var(--border);padding:16px 24px;text-align:center;font-size:11px;color:var(--ink-5)}
footer span{color:var(--ink-3);font-weight:600}

@media(max-width:720px){
  .wrap{padding:16px 12px 40px}
  .page-title{font-size:22px}
  .faq-header{padding:12px 12px}
  .faq-body{padding:0 12px 14px 34px}
  .faq-tabs{gap:4px}
  .faq-tab{padding:5px 8px;font-size:10px}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">
    <img src="lynx-head-white-200x200.png" alt="Lynx Support" onerror="this.style.display='none'">
    <div class="logo-divider"></div>
    <div class="crumbs">
      <a href="index.html" class="crumb-link">Lynx Support</a>
      <span class="crumb-sep">&rsaquo;</span>
      <span class="crumb-current">FAQ &amp; Troubleshooting</span>
    </div>
  </div>
  <div class="hdr-right">
    <span class="hdr-beta">In Beta</span>
  </div>
</div>

<div class="wrap">
  <div class="page-header">
    <h1 class="page-title">FAQ &amp; Troubleshooting</h1>
    <p class="page-sub">Common FinishLynx issues, product tips, and step-by-step fixes. Search or browse by category.</p>
  </div>

  <input class="faq-search" type="text" id="faqSearch" placeholder="Search issues, products, symptoms…">

  <div class="faq-tabs" id="faqTabs"></div>

  <div id="faqList"></div>
</div>

<footer><span>Lynx Support</span> &mdash; FAQ &amp; Troubleshooting</footer>

<script>
(function(){
var allFaq = [];
  var activeType = 'all';
  var openIds = {};

  fetch('support/data/faq.json')
    .then(function(r){ return r.json(); })
    .then(function(data){
      allFaq = data;
      buildTabs();
      render();
      // Auto-open from URL hash
      if(location.hash){
        var id = location.hash.slice(1);
        openIds[id] = true;
        render();
        var el = document.getElementById('faq-'+id);
        if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
      }
    });

  document.getElementById('faqSearch').addEventListener('input', render);

  var TYPE_LABELS = {
    troubleshooting: 'Troubleshooting',
    tip: 'Product Tips',
    reference: 'Reference',
    integration: 'Integration',
    networking: 'Networking',
    workflow: 'Workflow'
  };
  var TYPE_ORDER = ['troubleshooting','tip','reference','integration','networking','workflow'];

  function buildTabs(){
    var counts = {};
    allFaq.forEach(function(e){ counts[e.type] = (counts[e.type]||0)+1; });
    var html = '<button class="faq-tab active" data-type="all">All<span class="tab-count">'+allFaq.length+'</span></button>';
    TYPE_ORDER.forEach(function(t){
      if(!counts[t]) return;
      html += '<button class="faq-tab" data-type="'+t+'">'+(TYPE_LABELS[t]||t)+'<span class="tab-count">'+counts[t]+'</span></button>';
    });
    var container = document.getElementById('faqTabs');
    container.innerHTML = html;
    container.querySelectorAll('.faq-tab').forEach(function(tab){
      tab.addEventListener('click', function(){
        activeType = tab.dataset.type;
        container.querySelectorAll('.faq-tab').forEach(function(t){ t.classList.toggle('active', t === tab); });
        render();
      });
    });
  }

  function mdToHtml(md){
    var lines = md.split('\n');
    var html = '';
    var inList = false;
    var listType = null;
    lines.forEach(function(line){
      var trimmed = line.trim();
      if(!trimmed) { if(inList){ html += listType === 'ol' ? '</ol>' : '</ul>'; inList = false; } return; }

      var olMatch = trimmed.match(/^(\d+)\.\s+(.+)/);
      var ulMatch = trimmed.match(/^-\s+(.+)/);

      if(olMatch){
        if(!inList || listType !== 'ol'){ if(inList) html += listType==='ol'?'</ol>':'</ul>'; html += '<ol>'; inList = true; listType = 'ol'; }
        html += '<li>' + formatInline(olMatch[2]) + '</li>';
      } else if(ulMatch){
        if(!inList || listType !== 'ul'){ if(inList) html += listType==='ol'?'</ol>':'</ul>'; html += '<ul>'; inList = true; listType = 'ul'; }
        html += '<li>' + formatInline(ulMatch[1]) + '</li>';
      } else {
        if(inList){ html += listType === 'ol' ? '</ol>' : '</ul>'; inList = false; }
        html += '<p>' + formatInline(trimmed) + '</p>';
      }
    });
    if(inList) html += listType === 'ol' ? '</ol>' : '</ul>';
    return html;
  }

  function formatInline(s){
    return esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }

  function render(){
    var q = document.getElementById('faqSearch').value.toLowerCase().trim();
    var filtered = allFaq.filter(function(e){
      if(activeType !== 'all' && e.type !== activeType) return false;
      if(!q) return true;
      return (e.title + ' ' + e.content + ' ' + e.section).toLowerCase().indexOf(q) !== -1;
    });

    if(!filtered.length){
      document.getElementById('faqList').innerHTML = '<div class="empty">No matching entries found.</div>';
      return;
    }

    // Group by section
    var groups = {};
    var sectionOrder = [];
    filtered.forEach(function(e){
      if(!groups[e.section]){ groups[e.section] = []; sectionOrder.push(e.section); }
      groups[e.section].push(e);
    });

    var html = '';
    sectionOrder.forEach(function(section){
      html += '<div class="faq-section-label">'+esc(section)+'</div>';
      groups[section].forEach(function(e){
        var isOpen = openIds[e.id];
        html += '<div class="faq-entry '+esc(e.type||'')+(isOpen?' open':'')+'" id="faq-'+e.id+'" data-id="'+e.id+'">';
        html += '<div class="faq-header" onclick="toggleFaq(this)">';
        html += '<span class="faq-chevron">&#9654;</span>';
        html += '<span class="faq-badge '+e.type+'">'+(TYPE_LABELS[e.type]||e.type)+'</span>';
        html += '<span class="faq-title">'+esc(e.title)+'</span>';
        html += '</div>';
        html += '<div class="faq-body">'+mdToHtml(e.content)+'</div>';
        html += '</div>';
      });
    });
    document.getElementById('faqList').innerHTML = html;
  }

  function esc(s){
    return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  }

  // Global toggle for onclick
  window.toggleFaq = function(header){
    var entry = header.parentElement;
    var id = entry.dataset.id;
    entry.classList.toggle('open');
    if(entry.classList.contains('open')){
      openIds[id] = true;
      history.replaceState(null, '', '#'+id);
    } else {
      delete openIds[id];
      history.replaceState(null, '', location.pathname);
    }
  };
})();
</script>
<link rel="stylesheet" href="support/assets/lynx-assistant-widget.css">
<script src="support/assets/lynx-assistant-widget.js" defer></script>
</body>
</html>
