<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Builder &mdash; Lynx Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#E8A800;--nav-bg:#1a1a1a;--border:#111}
[data-theme="finishlynx"]{--gold:#55009C;--nav-bg:#2d004f;--border:#55009C}
[data-theme="glass"]{--gold:#E8A800;--nav-bg:rgba(0,0,0,.2);--border:rgba(255,255,255,.18)}
body{font-family:'Inter',sans-serif;overflow:hidden}

/* Nav */
.hdr{background:var(--nav-bg);border-bottom:3px solid var(--gold);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:fixed;top:0;left:0;right:0;z-index:100}
.logo{display:flex;align-items:center;gap:14px}
.logo img{height:32px;width:auto}
.logo-divider{width:1px;height:24px;background:rgba(255,255,255,.2)}
.crumbs{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#fff;letter-spacing:.3px;text-transform:uppercase}
.crumb-link{opacity:.55;text-decoration:none;color:inherit;transition:opacity .15s}
.crumb-link:hover{opacity:1}
.crumb-sep{opacity:.35;font-weight:400;font-size:15px}
.crumb-current{opacity:.95}
.hdr-right{display:flex;align-items:center;gap:14px}
.theme-picker{display:flex;align-items:center;gap:6px}
.theme-dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer;transition:transform .15s;padding:0;outline:none}
.theme-dot:hover{transform:scale(1.2)}
.theme-dot.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.hdr-beta{background:var(--gold);color:#111;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:4px 10px;border:1px solid var(--border)}
[data-theme="glass"] .hdr{backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);border-bottom:1px solid rgba(255,255,255,.15)}
[data-theme="glass"] .hdr-beta{background:rgba(232,168,0,.3);border-color:rgba(232,168,0,.5);color:#fff}
[data-theme="glass"] .theme-dot{border-color:rgba(255,255,255,.4)}

/* ===== Scene ===== */
.scene{position:relative;width:100%;height:calc(100vh - 56px);margin-top:56px;overflow:hidden}

/* Sky */
.sky{position:absolute;top:0;left:0;right:0;height:40%;background:linear-gradient(180deg,#0d47a1 0%,#1565c0 25%,#1e88e5 50%,#42a5f5 75%,#90caf9 100%)}

/* Clouds */
.cloud{position:absolute;background:#fff;border-radius:20px;opacity:.65}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.c1{top:12%;left:12%;width:100px;height:28px}
.c1::before{top:-14px;left:18px;width:45px;height:28px}
.c1::after{top:-9px;left:48px;width:35px;height:22px}
.c2{top:18%;left:55%;width:70px;height:20px;opacity:.45}
.c2::before{top:-10px;left:12px;width:32px;height:20px}
.c2::after{top:-6px;left:30px;width:24px;height:16px}
.c3{top:8%;left:78%;width:55px;height:16px;opacity:.35}
.c3::before{top:-8px;left:10px;width:25px;height:16px}
.c3::after{top:-5px;left:24px;width:18px;height:12px}

/* Tree line / grandstands behind far straight */
.trees{position:absolute;top:36%;left:0;right:0;height:7%;overflow:hidden}
.tree-base{position:absolute;bottom:0;left:0;right:0;height:55%;background:#2e7d32}
.tree-tops{position:absolute;bottom:40%;left:0;right:0;height:60%;background:repeating-linear-gradient(90deg,transparent 0px,transparent 8px,#1b5e20 8px,#1b5e20 12px,transparent 12px,transparent 18px,#2e7d32 18px,#2e7d32 24px,transparent 24px,transparent 30px,#388e3c 30px,#388e3c 36px,transparent 36px,transparent 42px);mask-image:linear-gradient(180deg,transparent 0%,#000 100%);-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 100%)}

/* Far straight (back side of the oval) */
.far-track{position:absolute;top:42%;left:0;right:0;height:5%;background:linear-gradient(180deg,#a33020 0%,#b83828 50%,#a33020 100%)}
.far-lane{position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.4)}
.far-curb-top{position:absolute;top:0;left:0;right:0;height:2px;background:#ccc}
.far-curb-bot{position:absolute;bottom:0;left:0;right:0;height:3px;background:#ddd}

/* Infield grass (center of the oval) */
.grass{position:absolute;top:47%;left:0;right:0;height:22%;background:linear-gradient(180deg,#2e7d32 0%,#388e3c 15%,#43a047 40%,#4caf50 65%,#66bb6a 100%)}
.grass-texture{position:absolute;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.03) 0px,rgba(0,0,0,.03) 2px,transparent 2px,transparent 8px);opacity:.5}

/* Near straight (home side, close to viewer) */
.track{position:absolute;top:69%;left:0;right:0;bottom:0;background:linear-gradient(180deg,#c62828 0%,#d32f2f 12%,#c62828 35%,#b71c1c 65%,#a31515 100%)}
.track-texture{position:absolute;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.04) 0px,rgba(0,0,0,.04) 1px,transparent 1px,transparent 4px);opacity:.6}

/* Track curb (infield grass / near track boundary) */
.curb{position:absolute;top:0;left:0;right:0;height:5px;background:#e0e0e0;border-bottom:2px solid #bbb}

/* Lane lines */
.lane{position:absolute;left:0;right:0;height:2px;background:rgba(255,255,255,.75)}

/* Finish line — vertical stripe across track */
.finish-line{position:absolute;left:50%;top:0;bottom:0;width:5px;background:#fff;z-index:10;box-shadow:0 0 8px rgba(255,255,255,.3);transform:translateX(-50%)}

/* ===== Person + Table Setup ===== */
.setup{position:absolute;top:50%;left:39%;transform:translateX(-50%) scale(1.8);transform-origin:center bottom;z-index:20}

/* Person (facing viewer, seated) */
.person{position:relative;width:44px;height:70px;margin:0 8px 0 auto}
/* Hair */
.p-hair{position:absolute;top:0;left:9px;width:26px;height:9px;background:#a08040;border-radius:2px 2px 0 0}
/* Head */
.p-head{position:absolute;top:7px;left:9px;width:26px;height:24px;background:#dea96b;border-radius:3px}
/* Eyes */
.p-eye{position:absolute;width:4px;height:4px;background:#333;border-radius:50%}
.p-eye-l{top:10px;left:6px}
.p-eye-r{top:10px;right:6px}
/* Mouth */
.p-mouth{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:8px;height:2px;background:#c0835a;border-radius:1px}
/* Torso (polo shirt) */
.p-torso{position:absolute;top:31px;left:5px;width:34px;height:28px;background:#7b1fa2}
.p-collar{position:absolute;top:0;left:50%;transform:translateX(-50%);width:12px;height:5px;background:#9c27b0;border-radius:0 0 3px 3px}
/* Arms */
.p-arm{position:absolute;top:36px;width:10px;height:22px;background:#dea96b;border-radius:2px}
.p-arm-l{left:-2px}
.p-arm-r{right:-2px}
/* Left hand resting */
.p-hand{position:absolute;bottom:-4px;width:8px;height:6px;background:#dea96b;border-radius:1px}
.p-hand-l{left:1px}
/* Right arm raised — upper arm stays, forearm points up */
.p-arm-r{height:14px}
.p-forearm{position:absolute;top:-16px;right:1px;width:8px;height:18px;background:#dea96b;border-radius:2px}
.p-hand-r{position:absolute;top:-5px;left:0;width:8px;height:6px;background:#dea96b;border-radius:1px}

/* Table */
.table-wrap{position:absolute;top:56px;left:-130px;width:180px;z-index:16}
.table-top{width:180px;height:6px;background:#f0f0f0;border:1px solid #ddd;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.table-leg{position:absolute;bottom:-32px;width:3px;height:32px;background:#e0e0e0}
.tl-l{left:10px}
.tl-r{right:10px}
/* Folding chair */
.chair{position:absolute;top:52px;left:6px;width:32px;z-index:13}
.chair-seat{width:32px;height:4px;background:#555;border-radius:1px}
.chair-back{position:absolute;top:-18px;left:1px;width:3px;height:20px;background:#555}
.chair-back-r{position:absolute;top:-18px;right:1px;width:3px;height:20px;background:#555}
.chair-backrest{position:absolute;top:-20px;left:0;width:32px;height:4px;background:#666;border-radius:1px}
.chair-leg-fl{position:absolute;bottom:-16px;left:3px;width:3px;height:16px;background:#555;transform:rotate(2deg)}
.chair-leg-fr{position:absolute;bottom:-16px;right:3px;width:3px;height:16px;background:#555;transform:rotate(-2deg)}
.chair-leg-bl{position:absolute;bottom:-14px;left:7px;width:3px;height:14px;background:#444;transform:rotate(-3deg)}
.chair-leg-br{position:absolute;bottom:-14px;right:7px;width:3px;height:14px;background:#444;transform:rotate(3deg)}
.chair-cross{position:absolute;bottom:-8px;left:6px;width:20px;height:2px;background:#444;transform:rotate(8deg)}
.chair-cross2{position:absolute;bottom:-8px;left:6px;width:20px;height:2px;background:#444;transform:rotate(-8deg)}
/* Person legs (seated, below table) */
.p-legs{position:absolute;top:55px;left:8px;display:flex;gap:4px}
.p-thigh{width:11px;height:6px;background:#333;border-radius:1px}
.p-shin{width:6px;height:14px;background:#333;margin:0 auto}
.p-shoe-p{width:8px;height:3px;background:#444;border-radius:0 0 2px 2px;margin:0 auto}
.p-leg-wrap{display:flex;flex-direction:column;align-items:center}
/* Stopwatch in hand */
.stopwatch{position:absolute;top:-18px;left:-1px;z-index:17}
.sw-ring{width:10px;height:12px;border:2px solid #888;border-radius:50%;background:#ddd;position:relative}
.sw-btn{position:absolute;top:-3px;left:50%;transform:translateX(-50%);width:3px;height:3px;background:#888;border-radius:1px 1px 0 0}
.sw-face{position:absolute;top:2px;left:2px;width:6px;height:6px;border-radius:50%;background:#fff}
.sw-hand{position:absolute;top:3px;left:4px;width:1px;height:3px;background:#c62828;transform-origin:bottom center;animation:sw-tick 1s steps(1) infinite}
@keyframes sw-tick{0%{transform:rotate(0deg)}25%{transform:rotate(90deg)}50%{transform:rotate(180deg)}75%{transform:rotate(270deg)}100%{transform:rotate(360deg)}}
/* Athletes */
.athlete{position:absolute;left:44%;z-index:8;display:flex;flex-direction:column;align-items:center;transform:translateY(-50%) scale(3.5);transform-origin:center center}
.ath-hair{width:8px;height:3px;background:#4a3728;border-radius:1px 1px 0 0}
.ath-head{width:9px;height:8px;background:#dea96b;border-radius:2px}
.ath-torso{width:12px;height:11px;border-radius:1px}
.ath-shorts{width:10px;height:5px;background:#222}
.ath-legs{display:flex;gap:2px}
.ath-leg{width:3px;height:9px;background:#dea96b;border-radius:0 0 1px 1px}
.ath-shoes{display:flex;gap:2px}
.ath-shoe{width:4px;height:2px;background:#fff;border-radius:0 0 1px 1px}
/* Starter official */
.starter{position:absolute;top:62%;right:8%;z-index:20;transform:scale(2.8);transform-origin:bottom center;display:flex;flex-direction:column;align-items:center}
.st-cap{width:14px;height:5px;background:#b71c1c;border-radius:2px 2px 0 0;position:relative}
.st-cap::after{content:'';position:absolute;bottom:0;left:-1px;right:-1px;height:2px;background:#8b1515;border-radius:0 0 1px 1px}
.st-head{width:12px;height:10px;background:#c9915a;border-radius:2px}
.st-eye{position:absolute;width:2px;height:2px;background:#333;border-radius:50%}
.st-eye-l{top:3px;left:2px}
.st-eye-r{top:3px;right:2px}
.st-jacket{width:18px;height:18px;background:#c62828;border-radius:1px;position:relative}
.st-lapel{position:absolute;top:0;left:50%;transform:translateX(-50%);width:4px;height:8px;background:#d32f2f;border-radius:0 0 2px 2px}
.st-shirt{position:absolute;top:0;left:50%;transform:translateX(-50%);width:4px;height:5px;background:#fff}
.st-pants{width:14px;height:14px;background:#333;margin:0 auto}
.st-arm{position:absolute;top:0;width:5px;height:18px;background:#c62828;border-radius:1px}
.st-arm-l{left:-4px}
.st-arm-r{right:-4px}
.st-hand{position:absolute;bottom:-3px;width:4px;height:4px;background:#c9915a;border-radius:1px}
.st-pistol{position:absolute;bottom:-3px;left:0;width:3px;height:6px;background:#444;border-radius:0 0 1px 1px}
.st-pistol::after{content:'';position:absolute;bottom:-4px;left:-1px;width:2px;height:5px;background:#555;border-radius:0 0 1px 1px}
.st-legs{display:flex;gap:2px;margin:0 auto}
.st-leg{width:5px;height:12px;background:#333;border-radius:0 0 1px 1px}
.st-shoes-wrap{display:flex;gap:2px;margin:0 auto}
.st-shoe{width:6px;height:3px;background:#222;border-radius:0 0 2px 2px}
/* Lane numbers */
.lane-num{position:absolute;left:54%;font-family:'Inter',sans-serif;font-weight:900;font-size:clamp(28px,5vh,56px);color:rgba(255,255,255,.8);text-align:center;line-height:1;pointer-events:none}
/* Lane dash marks (left side) */
.lane-dash{position:absolute;left:48%;width:3px;height:8px;background:rgba(255,255,255,.6)}
</style>
<script>
(function(){var t=localStorage.getItem('lynxpro-theme');if(t)document.documentElement.setAttribute('data-theme',t)})();
</script>
</head>
<body>

<div class="hdr">
  <div class="logo">
    <img src="lynx-head-white-200x200.png" alt="Lynx Pro" onerror="this.style.display='none'">
    <div class="logo-divider"></div>
    <div class="crumbs">
      <a href="index.html" class="crumb-link">Lynx Pro</a>
      <span class="crumb-sep">&rsaquo;</span>
      <span class="crumb-current">System Builder</span>
    </div>
  </div>
  <div class="hdr-right">
    <div class="theme-picker">
      <button class="theme-dot" data-theme="classic" style="background:#F5EFD6" title="Classic"></button>
      <button class="theme-dot" data-theme="finishlynx" style="background:#55009C" title="FinishLynx"></button>
      <button class="theme-dot" data-theme="glass" style="background:linear-gradient(180deg,#4a9ee8,#c04030)" title="Track"></button>
    </div>
    <span class="hdr-beta">In Beta</span>
  </div>
</div>

<div class="scene">
  <!-- Sky -->
  <div class="sky">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
  </div>

  <!-- Tree line -->
  <div class="trees">
    <div class="tree-tops"></div>
    <div class="tree-base"></div>
  </div>

  <!-- Far straight (back side of oval) -->
  <div class="far-track">
    <div class="far-curb-top"></div>
    <div class="far-lane" style="top:25%"></div>
    <div class="far-lane" style="top:45%"></div>
    <div class="far-lane" style="top:65%"></div>
    <div class="far-lane" style="top:85%"></div>
    <div class="far-curb-bot"></div>
  </div>

  <!-- Infield grass (center of the oval) -->
  <div class="grass">
    <div class="grass-texture"></div>
  </div>

  <!-- Track -->
  <div class="track">
    <div class="track-texture"></div>
    <div class="curb"></div>
    <div class="lane" style="top:25%"></div>
    <div class="lane" style="top:50%"></div>
    <div class="lane" style="top:75%"></div>
    <div class="lane-num" style="top:5%">1</div>
    <div class="lane-num" style="top:30%">2</div>
    <div class="lane-num" style="top:55%">3</div>
    <div class="lane-num" style="top:80%">4</div>
    <div class="lane-dash" style="top:25%"></div>
    <div class="lane-dash" style="top:50%"></div>
    <div class="lane-dash" style="top:75%"></div>
    <!-- Athletes standing behind finish line -->
    <div class="athlete" style="top:5%">
      <div class="ath-hair"></div><div class="ath-head"></div>
      <div class="ath-torso" style="background:#e53935"></div>
      <div class="ath-shorts"></div>
      <div class="ath-legs"><div class="ath-leg"></div><div class="ath-leg"></div></div>
      <div class="ath-shoes"><div class="ath-shoe"></div><div class="ath-shoe"></div></div>
    </div>
    <div class="athlete" style="top:30%">
      <div class="ath-hair"></div><div class="ath-head"></div>
      <div class="ath-torso" style="background:#1565c0"></div>
      <div class="ath-shorts"></div>
      <div class="ath-legs"><div class="ath-leg"></div><div class="ath-leg"></div></div>
      <div class="ath-shoes"><div class="ath-shoe"></div><div class="ath-shoe"></div></div>
    </div>
    <div class="athlete" style="top:55%">
      <div class="ath-hair"></div><div class="ath-head"></div>
      <div class="ath-torso" style="background:#2e7d32"></div>
      <div class="ath-shorts"></div>
      <div class="ath-legs"><div class="ath-leg"></div><div class="ath-leg"></div></div>
      <div class="ath-shoes"><div class="ath-shoe"></div><div class="ath-shoe"></div></div>
    </div>
    <div class="athlete" style="top:80%">
      <div class="ath-hair"></div><div class="ath-head"></div>
      <div class="ath-torso" style="background:#ef6c00"></div>
      <div class="ath-shorts"></div>
      <div class="ath-legs"><div class="ath-leg"></div><div class="ath-leg"></div></div>
      <div class="ath-shoes"><div class="ath-shoe"></div><div class="ath-shoe"></div></div>
    </div>
    <div class="finish-line"></div>
  </div>

  <!-- Starter official (right side, on grass) -->
  <div class="starter">
    <div class="st-cap"></div>
    <div class="st-head">
      <div class="st-eye st-eye-l"></div>
      <div class="st-eye st-eye-r"></div>
    </div>
    <div class="st-jacket">
      <div class="st-shirt"></div>
      <div class="st-lapel"></div>
      <div class="st-arm st-arm-l"><div class="st-hand"></div><div class="st-pistol"></div></div>
      <div class="st-arm st-arm-r"><div class="st-hand"></div></div>
    </div>
    <div class="st-pants"></div>
    <div class="st-legs"><div class="st-leg"></div><div class="st-leg"></div></div>
    <div class="st-shoes-wrap"><div class="st-shoe"></div><div class="st-shoe"></div></div>
  </div>

  <!-- Person + Table -->
  <div class="setup">
    <div class="person">
      <div class="p-hair"></div>
      <div class="p-head">
        <div class="p-eye p-eye-l"></div>
        <div class="p-eye p-eye-r"></div>
        <div class="p-mouth"></div>
      </div>
      <div class="p-torso">
        <div class="p-collar"></div>
      </div>
      <div class="p-arm p-arm-l"><div class="p-hand p-hand-l"></div></div>
      <div class="p-arm p-arm-r"><div class="p-forearm"><div class="p-hand-r"><div class="stopwatch"><div class="sw-ring"><div class="sw-btn"></div><div class="sw-face"><div class="sw-hand"></div></div></div></div></div></div></div>
      <div class="chair">
        <div class="chair-backrest"></div>
        <div class="chair-back"></div>
        <div class="chair-back-r"></div>
        <div class="chair-seat"></div>
        <div class="chair-leg-fl"></div>
        <div class="chair-leg-fr"></div>
        <div class="chair-leg-bl"></div>
        <div class="chair-leg-br"></div>
        <div class="chair-cross"></div>
        <div class="chair-cross2"></div>
      </div>
      <div class="p-legs">
        <div class="p-leg-wrap"><div class="p-thigh"></div><div class="p-shin"></div><div class="p-shoe-p"></div></div>
        <div class="p-leg-wrap"><div class="p-thigh"></div><div class="p-shin"></div><div class="p-shoe-p"></div></div>
      </div>
    </div>
    <div class="table-wrap">
      <div class="table-top"></div>
      <div class="table-leg tl-l"></div>
      <div class="table-leg tl-r"></div>
    </div>
  </div>
</div>

<script>
(function(){
  var cur = localStorage.getItem('lynxpro-theme') || 'classic';
  document.querySelectorAll('.theme-dot').forEach(function(dot){
    if(dot.dataset.theme === cur) dot.classList.add('active');
    dot.addEventListener('click', function(){
      var theme = dot.dataset.theme;
      document.documentElement.setAttribute('data-theme', theme === 'classic' ? '' : theme);
      localStorage.setItem('lynxpro-theme', theme);
      document.querySelectorAll('.theme-dot').forEach(function(d){ d.classList.toggle('active', d === dot); });
    });
  });
})();

// Athlete fidgeting — JS-driven for truly independent random movement
(function(){
  var athletes = document.querySelectorAll('.athlete');
  athletes.forEach(function(ath){
    var base = 'translateY(-50%) scale(3.5)';
    ath.style.transition = 'transform .15s ease-out';
    function fidget(){
      var dy = -(Math.random() * 3.5 + 0.5); // bounce up 0.5–4%
      var dx = (Math.random() - 0.5) * 0.8;  // tiny lateral
      ath.style.transform = base + ' translateY(' + dy + '%) translateX(' + dx + 'px)';
      setTimeout(function(){
        ath.style.transform = base;
      }, 120 + Math.random() * 80);
      // next fidget: random wait 400–2200ms
      setTimeout(fidget, 400 + Math.random() * 1800);
    }
    // stagger start so they don't all begin together
    setTimeout(fidget, Math.random() * 2000);
  });
})();
</script>
</body>
</html>
