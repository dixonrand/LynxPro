<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Video Library &mdash; Lynx Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
:root{--bg:#F5EFD6;--bg-card:#FDFAF0;--bg-section:#EDE4BF;--gold:#E8A800;--ink:#111;--ink-2:#333;--ink-3:#555;--ink-4:#666;--ink-5:#888;--ink-6:#aaa;--nav-bg:#1a1a1a;--border:#111;--border-row:rgba(0,0,0,.12);--border-col:rgba(0,0,0,.08)}
[data-theme="finishlynx"]{--bg:#e9e9e9;--bg-card:#fff;--bg-section:#efe8f5;--gold:#55009C;--ink:#222;--ink-2:#333;--ink-3:#555;--ink-4:#666;--ink-5:#888;--ink-6:#aaa;--nav-bg:#2d004f;--border:#55009C;--border-row:rgba(85,0,156,.12);--border-col:rgba(85,0,156,.06)}
[data-theme="glass"]{--bg:transparent;--bg-card:rgba(255,255,255,.08);--bg-section:rgba(255,255,255,.1);--gold:#E8A800;--ink:#fff;--ink-2:rgba(255,255,255,.9);--ink-3:rgba(255,255,255,.7);--ink-4:rgba(255,255,255,.6);--ink-5:rgba(255,255,255,.45);--ink-6:rgba(255,255,255,.3);--nav-bg:rgba(0,0,0,.2);--border:rgba(255,255,255,.18);--border-row:rgba(255,255,255,.1);--border-col:rgba(255,255,255,.06)}
html{background:var(--bg)}body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:15px;min-height:100vh;display:flex;flex-direction:column}
.hdr{background:var(--nav-bg);border-bottom:3px solid var(--gold);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:14px}
.logo img{height:32px;width:auto;display:block}
.logo-divider{width:1px;height:24px;background:rgba(255,255,255,.2)}
.crumbs{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#fff;letter-spacing:.3px;text-transform:uppercase}
.crumb-link{opacity:.55;text-decoration:none;color:inherit;transition:opacity .15s}
.crumb-link:hover{opacity:1}
.crumb-sep{opacity:.35;font-weight:400;font-size:15px}
.crumb-current{opacity:.95}
.hdr-right{display:flex;align-items:center;gap:14px}
.theme-picker{display:flex;align-items:center;gap:6px}
.theme-dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer;transition:transform .15s;padding:0;outline:none}
.theme-dot:hover{transform:scale(1.2)}
.theme-dot.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.hdr-beta{background:var(--gold);color:#111;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:4px 10px;border:1px solid var(--border)}
[data-theme="glass"] html{background:linear-gradient(180deg,#2080d8 0%,#45a8f0 18%,#1d6820 30%,#3a9535 38%,#c43525 42%,#8a1c0c 100%) fixed;min-height:100vh}
[data-theme="glass"] body{background:transparent}
[data-theme="glass"] .hdr{backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);border-bottom:1px solid rgba(255,255,255,.15)}
[data-theme="glass"] .hdr-beta{background:rgba(232,168,0,.3);border-color:rgba(232,168,0,.5);color:#fff}
[data-theme="glass"] .theme-dot{border-color:rgba(255,255,255,.4)}

.wrap{max-width:1100px;margin:0 auto;padding:24px 24px 64px;width:100%;flex:1}
.page-header{margin-bottom:8px}
.page-title{font-size:28px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
.page-sub{font-size:14px;color:var(--ink-4);margin-bottom:20px}

/* Filter tabs */
.vid-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px}
.vid-tab{background:var(--bg-card);border:1.5px solid var(--border);color:var(--ink);font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:6px 14px;cursor:pointer;transition:background .12s}
.vid-tab:hover{background:var(--bg-section)}
.vid-tab.active{background:var(--ink);color:var(--bg-card)}
.vid-tab .tab-count{font-family:'JetBrains Mono',monospace;font-size:10px;opacity:.55;margin-left:4px}

/* Video grid */
.vid-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.vid-card{background:var(--bg-card);border:1px solid var(--border-row);overflow:hidden;transition:border-color .15s,transform .15s,box-shadow .15s}
.vid-card:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.1)}

/* Thumbnail with play button overlay */
.vid-thumb{position:relative;width:100%;padding-bottom:56.25%;background:#000;cursor:pointer;overflow:hidden}
.vid-thumb img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;transition:opacity .2s}
.vid-thumb:hover img{opacity:.85}
.play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;background:rgba(0,0,0,.7);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .15s}
.vid-thumb:hover .play-btn{background:rgba(200,16,46,.9)}
.play-btn::after{content:'';width:0;height:0;border-style:solid;border-width:10px 0 10px 18px;border-color:transparent transparent transparent #fff;margin-left:3px}

/* Embedded player replaces thumbnail */
.vid-player{position:relative;width:100%;padding-bottom:56.25%;background:#000}
.vid-player iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}

.vid-body{padding:14px 16px}
.vid-cat{font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-5);margin-bottom:4px}
.vid-title{font-size:14px;font-weight:700;color:var(--ink);line-height:1.3;margin-bottom:6px}
.vid-desc{font-size:12px;color:var(--ink-4);line-height:1.45}

.empty{text-align:center;padding:48px 24px;color:var(--ink-5);font-size:14px}

[data-theme="glass"] .vid-card{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

footer{border-top:2px solid var(--border);padding:16px 24px;text-align:center;font-size:11px;color:var(--ink-5)}
footer span{color:var(--ink-3);font-weight:600}

@media(max-width:720px){
  .wrap{padding:16px 12px 40px}
  .page-title{font-size:22px}
  .vid-grid{grid-template-columns:1fr;gap:12px}
}
</style>
<script>
(function(){var t=localStorage.getItem('lynxpro-theme');if(t)document.documentElement.setAttribute('data-theme',t)})();
</script>
</head>
<body>

<div class="hdr">
  <div class="logo">
    <img src="lynx-head-white-200x200.png" alt="Lynx Pro" onerror="this.style.display='none'">
    <div class="logo-divider"></div>
    <div class="crumbs">
      <a href="index.html" class="crumb-link">Lynx Pro</a>
      <span class="crumb-sep">&rsaquo;</span>
      <span class="crumb-current">Video Library</span>
    </div>
  </div>
  <div class="hdr-right">
    <div class="theme-picker">
      <button class="theme-dot" data-theme="classic" style="background:#F5EFD6" title="Classic"></button>
      <button class="theme-dot" data-theme="finishlynx" style="background:#55009C" title="FinishLynx"></button>
      <button class="theme-dot" data-theme="glass" style="background:linear-gradient(180deg,#4a9ee8,#c04030)" title="Track"></button>
    </div>
    <span class="hdr-beta">In Beta</span>
  </div>
</div>

<div class="wrap">
  <div class="page-header">
    <h1 class="page-title">Video Library</h1>
    <p class="page-sub">Training webinars, troubleshooting walkthroughs, and setup tutorials for FinishLynx products.</p>
  </div>

  <div class="vid-tabs" id="vidTabs"></div>
  <div class="vid-grid" id="vidGrid"></div>
</div>

<footer><span>Lynx Pro</span> &mdash; Video Library</footer>

<script>
(function(){
  // Theme
  var cur = localStorage.getItem('lynxpro-theme') || 'classic';
  document.querySelectorAll('.theme-dot').forEach(function(dot){
    if(dot.dataset.theme === cur) dot.classList.add('active');
    dot.addEventListener('click', function(){
      var theme = dot.dataset.theme;
      document.documentElement.setAttribute('data-theme', theme === 'classic' ? '' : theme);
      localStorage.setItem('lynxpro-theme', theme);
      document.querySelectorAll('.theme-dot').forEach(function(d){ d.classList.toggle('active', d === dot); });
    });
  });

  var allVids = [];
  var activeCat = 'all';

  fetch('support/data/resources.json')
    .then(function(r){ return r.json(); })
    .then(function(data){
      allVids = data.filter(function(d){ return d.type === 'video'; });
      buildTabs();
      render();
    });

  function getYouTubeId(url){
    var m = url.match(/[?&]v=([^&#]+)/) || url.match(/youtu\.be\/([^?&#]+)/);
    return m ? m[1] : null;
  }

  function buildTabs(){
    var counts = {};
    allVids.forEach(function(v){ counts[v.subcategory] = (counts[v.subcategory]||0)+1; });
    var container = document.getElementById('vidTabs');
    var html = '<button class="vid-tab active" data-cat="all">All<span class="tab-count">'+allVids.length+'</span></button>';
    Object.keys(counts).forEach(function(cat){
      html += '<button class="vid-tab" data-cat="'+esc(cat)+'">'+esc(cat)+'<span class="tab-count">'+counts[cat]+'</span></button>';
    });
    container.innerHTML = html;
    container.querySelectorAll('.vid-tab').forEach(function(tab){
      tab.addEventListener('click', function(){
        activeCat = tab.dataset.cat;
        container.querySelectorAll('.vid-tab').forEach(function(t){ t.classList.toggle('active', t === tab); });
        render();
      });
    });
  }

  function render(){
    var filtered = allVids.filter(function(v){
      return activeCat === 'all' || v.subcategory === activeCat;
    });

    if(!filtered.length){
      document.getElementById('vidGrid').innerHTML = '<div class="empty">No videos in this category.</div>';
      return;
    }

    var html = '';
    filtered.forEach(function(v, i){
      var ytId = getYouTubeId(v.url);
      var thumb = ytId ? 'https://img.youtube.com/vi/'+ytId+'/mqdefault.jpg' : '';
      html += '<div class="vid-card">';
      html += '<div class="vid-thumb" data-id="'+esc(ytId)+'" data-idx="'+i+'" onclick="playVideo(this)">';
      if(thumb) html += '<img src="'+esc(thumb)+'" alt="'+esc(v.title)+'" loading="lazy">';
      html += '<div class="play-btn"></div>';
      html += '</div>';
      html += '<div class="vid-body">';
      html += '<div class="vid-cat">'+esc(v.subcategory)+'</div>';
      html += '<div class="vid-title">'+esc(v.title)+'</div>';
      if(v.use) html += '<div class="vid-desc">'+esc(v.use)+'</div>';
      html += '</div></div>';
    });
    document.getElementById('vidGrid').innerHTML = html;
  }

  window.playVideo = function(el){
    var ytId = el.dataset.id;
    if(!ytId) return;
    el.outerHTML = '<div class="vid-player"><iframe src="https://www.youtube.com/embed/'+ytId+'?autoplay=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>';
  };

  function esc(s){
    return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  }
})();
</script>
</body>
</html>
