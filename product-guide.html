<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Product Guide &mdash; Lynx Support</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
:root{--bg:#FFFFFF;--bg-card:#FFFFFF;--bg-section:#EAE0F2;--gold:#E8A800;--ink:#111;--ink-2:#333;--ink-3:#555;--ink-4:#666;--ink-5:#888;--ink-6:#aaa;--nav-bg:#2d004f;--border:#C7C7C7;--border-row:rgba(0,0,0,.16);--purple:#55009C}
[data-theme="warm"]{--bg:#F5EFD6;--bg-card:#FDFAF0;--bg-section:#EDE4BF;--gold:#E8A800;--ink:#111;--ink-2:#333;--ink-3:#555;--ink-4:#666;--ink-5:#888;--ink-6:#aaa;--nav-bg:#1a1a1a;--border:#111;--border-row:rgba(0,0,0,.12);--purple:#55009C}
[data-theme="glass"]{--bg:transparent;--bg-card:rgba(255,255,255,.08);--bg-section:rgba(255,255,255,.1);--gold:#E8A800;--ink:#fff;--ink-2:rgba(255,255,255,.9);--ink-3:rgba(255,255,255,.7);--ink-4:rgba(255,255,255,.6);--ink-5:rgba(255,255,255,.45);--ink-6:rgba(255,255,255,.3);--nav-bg:rgba(0,0,0,.2);--border:rgba(255,255,255,.18);--border-row:rgba(255,255,255,.1);--border-col:rgba(255,255,255,.06)}
html{background:var(--bg)}body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:15px;min-height:100vh;display:flex;flex-direction:column}
.hdr{background:var(--nav-bg);border-bottom:3px solid var(--gold);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:14px}
.logo img{height:32px;width:auto;display:block}
.logo-divider{width:1px;height:24px;background:rgba(255,255,255,.2)}
.crumbs{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#fff;letter-spacing:.3px;text-transform:uppercase}
.crumb-link{opacity:.55;text-decoration:none;color:inherit;transition:opacity .15s}
.crumb-link:hover{opacity:1}
.crumb-sep{opacity:.35;font-weight:400;font-size:15px}
.crumb-current{opacity:.95}
.hdr-right{display:flex;align-items:center;gap:14px}
.theme-picker{display:flex;align-items:center;gap:6px}
.theme-dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer;transition:transform .15s;padding:0;outline:none}
.theme-dot:hover{transform:scale(1.2)}
.theme-dot.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.hdr-beta{background:var(--gold);color:#111;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:4px 10px;border:1px solid var(--border)}
.wrap{margin:0 auto;padding:16px 16px 28px;width:100%;flex:1}
.cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--border)}
.cat-tab{flex:1 1 0;min-width:0;background:var(--bg-card);border:2px solid var(--border);color:var(--ink);font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:5px 8px;cursor:pointer;transition:transform .12s,box-shadow .12s,background .15s;text-align:center}
.cat-tab:hover{background:var(--bg-section);transform:translateY(-2px);box-shadow:3px 3px 0 var(--border)}
.cat-tab:active{transform:translateY(0);box-shadow:1px 1px 0 var(--border)}
.cat-tab.active{background:var(--ink);color:var(--bg-card);box-shadow:3px 3px 0 var(--gold)}
.cat-tab.active:hover{transform:translateY(-2px);box-shadow:4px 4px 0 var(--gold)}
.cat-panel{display:none}
.cat-panel.active{display:block}
.sub-tabs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.sub-tab{background:transparent;border:1.5px solid var(--border);color:var(--ink);font-family:inherit;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:5px 14px;cursor:pointer;transition:background .15s}
.sub-tab:hover{background:var(--bg-section)}
.sub-tab.active{background:var(--ink);color:var(--bg-card)}
.sub-panel{display:none}
.sub-panel.active{display:block}
.cmp-empty{padding:44px 24px;text-align:center;color:var(--ink-5);font-size:13px;background:var(--bg-card);border:2px dashed var(--border)}
.compare{background:var(--bg-card);border:2px solid var(--border);overflow:hidden}
.cmp-row{display:flex;align-items:stretch}
.cmp-row + .cmp-row,.cmp-section + .cmp-row,.cmp-row + .cmp-section{border-top:1px solid var(--border-row)}
.cmp-cell{flex:1 1 0;min-width:0;max-width:100%;background:var(--bg-card);padding:12px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;border-left:1px solid var(--border-col);transition:max-width .55s cubic-bezier(.4,0,.2,1),padding .55s cubic-bezier(.4,0,.2,1),opacity .3s ease,border-left-width .55s cubic-bezier(.4,0,.2,1)}
.cmp-row > .cmp-cell:first-child{border-left:0}
.cmp-header{padding:8px 10px 14px;min-height:90px}
.cmp-model-num{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:800;letter-spacing:.8px;color:var(--ink-3);text-transform:uppercase;margin-bottom:6px;white-space:nowrap}
.cmp-name{font-size:13px;font-weight:800;letter-spacing:-.2px;color:var(--ink);line-height:1.2}
.cmp-tagline{font-size:11px;color:var(--ink-4);margin-top:5px;line-height:1.45}
.cmp-status{display:inline-block;margin-top:7px;font-size:8px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:2px 6px;border:1.5px solid var(--border);white-space:nowrap}
.cmp-status.available{background:#F5C518;color:#111}
.cmp-status.retired{background:var(--ink);color:var(--bg-card)}
.cmp-img-cell{padding:14px 8px;height:120px}
.cmp-img-cell img{max-width:100%;max-height:90px;width:auto;height:auto;display:block;object-fit:contain}
.cmp-img-placeholder{font-size:9px;color:var(--ink-6);font-style:italic;letter-spacing:.3px;text-transform:uppercase}
.cmp-section{background:var(--bg-section);padding:8px 14px;font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-3);text-align:left}
.cmp-spec{font-size:12px;font-weight:700;line-height:1.45;color:var(--ink-2);min-height:46px}
.cmp-spec-label{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-5);margin-bottom:3px}
.compare[data-filter="available"] .cmp-cell[data-status="retired"]{max-width:0;padding-left:0;padding-right:0;opacity:0;border-left-width:0;pointer-events:none}
/* Mobile: instead of squishing every column to fit, give each a fixed
   readable minimum and let the whole comparison scroll horizontally. */
@media (max-width:720px){
  .compare{overflow-x:auto;overflow-y:visible;-webkit-overflow-scrolling:touch}
  .cmp-row{width:max-content;min-width:100%}
  .cmp-section{min-width:100%}
  .cmp-cell{flex:0 0 140px;min-width:140px;max-width:140px}
  .compare[data-filter="available"] .cmp-cell[data-status="retired"]{flex-basis:0;min-width:0;max-width:0}
  .cmp-img-cell{height:96px}
  .cmp-img-cell img{max-height:72px}
}
footer{border-top:2px solid var(--border);padding:16px 24px;text-align:center;font-size:11px;color:var(--ink-5)}
footer span{color:var(--ink-3);font-weight:600}
/* Glass / Track theme */
[data-theme="glass"] html{background:linear-gradient(180deg,#2080d8 0%,#45a8f0 18%,#1d6820 30%,#3a9535 38%,#c43525 42%,#8a1c0c 100%) fixed;min-height:100vh}
[data-theme="glass"] body{background:transparent}
[data-theme="glass"] .hdr{backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);border-bottom:1px solid rgba(255,255,255,.15)}
[data-theme="glass"] .hdr-beta{background:rgba(232,168,0,.3);border-color:rgba(232,168,0,.5);color:#fff}
[data-theme="glass"] .cat-tabs{border-bottom:1px solid rgba(255,255,255,.12)}
[data-theme="glass"] .cat-tab{backdrop-filter:blur(10px) saturate(140%);-webkit-backdrop-filter:blur(10px) saturate(140%);border-radius:12px;border:1px solid rgba(255,255,255,.2)}
[data-theme="glass"] .cat-tab:hover{box-shadow:0 4px 16px rgba(0,0,0,.18);background:rgba(255,255,255,.15)}
[data-theme="glass"] .cat-tab:active{box-shadow:0 2px 8px rgba(0,0,0,.12)}
[data-theme="glass"] .cat-tab.active{background:rgba(255,255,255,.22);color:#fff;box-shadow:0 4px 20px rgba(0,0,0,.2)}
[data-theme="glass"] .cat-tab.active:hover{box-shadow:0 6px 24px rgba(0,0,0,.28)}
[data-theme="glass"] .sub-tab{border-radius:20px;border:1px solid rgba(255,255,255,.2)}
[data-theme="glass"] .sub-tab.active{background:rgba(255,255,255,.22);color:#fff}
[data-theme="glass"] .compare{backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);border-radius:18px;border:1px solid rgba(255,255,255,.18);box-shadow:0 8px 32px rgba(0,0,0,.18)}
[data-theme="glass"] .cmp-cell{background:transparent}
[data-theme="glass"] .cmp-section{background:rgba(255,255,255,.08)}
[data-theme="glass"] .cmp-status.available{background:rgba(245,197,24,.35);color:#fff;border-color:rgba(245,197,24,.5)}
[data-theme="glass"] .cmp-status.retired{background:rgba(255,255,255,.12);color:rgba(255,255,255,.65);border-color:rgba(255,255,255,.18)}
[data-theme="glass"] .cmp-empty{backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);border-radius:14px;border:1px dashed rgba(255,255,255,.22)}
[data-theme="glass"] .theme-dot{border-color:rgba(255,255,255,.4)}
[data-theme="glass"] footer{border-top:1px solid rgba(255,255,255,.12)}
</style>
<script>
// Apply saved theme before paint
(function(){var t=localStorage.getItem('lynxpro-theme');if(t==='classic'){t='warm';localStorage.setItem('lynxpro-theme','warm');}else if(t==='finishlynx'){t='';localStorage.removeItem('lynxpro-theme');}if(t)document.documentElement.setAttribute('data-theme',t)})();
</script>
</head>

<script>
(function(){
  // ----- EtherLynx Cameras data -----
  // Add spec rows here in the order they should appear in the comparison.
  // Use {section:'Name'} to insert a section header row that spans all columns.
  // Use {key:'someKey'} to add a spec row pulling m.specs.someKey from each model.
  const EC_SPECS = [
    {key:'releaseDate', label:'Release Date'},
    {section:'Camera Specs'},
    {key:'standardFrameRate', label:'Standard Frame Rate', rank:true},
    {key:'maxFrameRate', label:'Max Frame Rate', rank:true},
    {key:'standardPixelDensity', label:'Standard Pixel Density', rank:true},
    {key:'maxPixelDensity', label:'Max Pixel Density', rank:true},
    {section:'Lens Mount'},
    {key:'standardMount', label:'Standard Mount'},
    {key:'alternateMounts', label:'Alternate Mounts'},
    {key:'compatibleLenses', label:'Compatible Lenses'},
    {section:'Camera Features'},
    {key:'poeCapable', label:'PoE Capable', rank:true},
    {key:'onBoardBattery', label:'On-Board Battery', rank:true},
    {key:'luxBoostMax', label:'Max LuxBoost', rank:true},
  ];

  // Each model: { modelNumber, name, tagline, image, status:'available'|'retired', specs:{...} }
  const EC_MODELS = [
    { modelNumber: '5L100', name: 'EtherLynx 2000',               status: 'retired',   image: '5L100%20Photo.png',  specs: { releaseDate: '1997', standardMount: 'C-Mount',  alternateMounts: 'CS-Mount', compatibleLenses: ['8-48mm (C)','12.5-75mm (C)','25mm (C)'], poeCapable: 'No', onBoardBattery: 'No' } },
    { modelNumber: '5L200', name: 'EtherLynx 2000',               status: 'retired',   image: '5L200%20Photo.png',  specs: { releaseDate: '2000', standardMount: 'C-Mount',  alternateMounts: 'CS-Mount', compatibleLenses: ['8-48mm (C)','12.5-75mm (C)','25mm (C)'], poeCapable: 'No', onBoardBattery: 'No' } },
    { modelNumber: '5L300', name: 'EtherLynx Supportfessional',       status: 'retired',   image: '5L300%20Photo.png',  specs: { standardMount: 'C-Mount',  alternateMounts: 'CS-Mount', compatibleLenses: ['8-48mm (C)','12.5-75mm (C)','25mm (C)'], standardFrameRate: '3000', maxFrameRate: '10000', standardPixelDensity: '1350', maxPixelDensity: '4000', poeCapable: 'No', onBoardBattery: 'No' } },
    { modelNumber: '5L400', name: 'EtherLynx Fusion',             status: 'retired',   image: '5L400%20Photo.png',  specs: { standardMount: 'C-Mount',  alternateMounts: 'CS-Mount', compatibleLenses: ['8-48mm (C)','12.5-75mm (C)','25mm (C)'], standardFrameRate: '2000', maxFrameRate: '3000', standardPixelDensity: '1000', maxPixelDensity: '2700', poeCapable: 'No', onBoardBattery: 'No' } },
    { modelNumber: '5L410', name: 'EtherLynx Scholastic',         status: 'retired',   image: '5L410%20Photo.png',  specs: { standardMount: 'C-Mount',  alternateMounts: 'CS-Mount', compatibleLenses: ['8-48mm (C)','12.5-75mm (C)','25mm (C)'], poeCapable: 'No', onBoardBattery: 'No' } },
    { modelNumber: '5L420', name: 'EtherLynx 2000+',              status: 'retired',   image: '5L420%20Photo.png',  specs: { standardMount: 'C-Mount',  alternateMounts: 'CS-Mount', compatibleLenses: ['8-48mm (C)','12.5-75mm (C)','25mm (C)'], standardFrameRate: '1000', maxFrameRate: '2000', standardPixelDensity: '500', maxPixelDensity: '1000', poeCapable: 'No', onBoardBattery: 'No' } },
    { modelNumber: '5L510', name: 'EtherLynx Vision Scholastic',  status: 'available', image: '5L510%20Photo.png',  specs: { releaseDate: '2014', standardMount: 'CS-Mount', alternateMounts: 'C-Mount', compatibleLenses: ['2.8-10mm (CS)','5-50mm (CS)','6mm (CS)'], standardFrameRate: '600',  maxFrameRate: '600', standardPixelDensity: '640', maxPixelDensity: '640', poeCapable: 'Yes', onBoardBattery: 'No' } },
    { modelNumber: '5L500', name: 'EtherLynx Vision',             status: 'available', image: '5L500%20Photo.png',  specs: { releaseDate: '2014', standardMount: 'C-Mount',  alternateMounts: 'CS-Mount', compatibleLenses: ['8-48mm (C)','12.5-75mm (C)','25mm (C)','2.8-10mm (CS)','5-50mm (CS)','6mm (CS)'], standardFrameRate: '1000', maxFrameRate: '2000', standardPixelDensity: '640', maxPixelDensity: '1280', poeCapable: 'Yes', onBoardBattery: 'Optional', luxBoostMax: '4x' } },
    { modelNumber: '5L600', name: 'EtherLynx Vision Pro',         status: 'available', image: '5L600%20Photo.png',  specs: { releaseDate: '2016', standardMount: 'C-Mount',  alternateMounts: 'CS-Mount', compatibleLenses: ['8-48mm (C)','12.5-75mm (C)','25mm (C)','2.8-10mm (CS)','5-50mm (CS)','6mm (CS)'], standardFrameRate: '3000', maxFrameRate: '20000', standardPixelDensity: '1024', maxPixelDensity: '2048', poeCapable: 'Yes', onBoardBattery: 'Optional', luxBoostMax: '4x' } },
    { modelNumber: '5L700', name: 'EtherLynx Vision Pro X',       status: 'available', image: '5L700%20Photo.png',  specs: { releaseDate: '2025', standardMount: 'F-Mount',  alternateMounts: 'C-Mount', standardFrameRate: '40000', maxFrameRate: '40000', standardPixelDensity: '2560', maxPixelDensity: '5120', poeCapable: 'Yes', onBoardBattery: 'Optional', luxBoostMax: '16x' } },
  ];

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function rankVal(raw){
    if(raw==null||raw==='')return 0;
    var s=String(raw);
    var x=s.match(/^(\d+\.?\d*)x$/i);
    if(x)return parseFloat(x[1]);
    if(s.toLowerCase()==='yes')return 1;
    if(s.toLowerCase()==='optional')return 0.5;
    if(s.toLowerCase()==='no')return 0;
    var n=parseFloat(s.replace(/,/g,''));
    return isNaN(n)?0:n;
  }

  function statusAttr(m){
    return m.status ? ' data-status="' + esc(m.status) + '"' : '';
  }

  function buildCompare(models, specs){
    if (!models.length) return '<div class="cmp-empty">No models to show yet.</div>';
    let html = '';

    // Header row: model number, name, tagline, status badge
    html += '<div class="cmp-row">';
    models.forEach(m => {
      html += '<div class="cmp-cell cmp-header"' + statusAttr(m) + '>';
      if (m.modelNumber) html += '<div class="cmp-model-num">' + esc(m.modelNumber) + '</div>';
      html += '<div class="cmp-name">' + esc(m.name) + '</div>';
      if (m.tagline) html += '<div class="cmp-tagline">' + esc(m.tagline) + '</div>';
      if (m.status) html += '<span class="cmp-status ' + esc(m.status) + '">' + esc(m.status) + '</span>';
      html += '</div>';
    });
    html += '</div>';

    // Image row
    html += '<div class="cmp-row">';
    models.forEach(m => {
      html += '<div class="cmp-cell cmp-img-cell"' + statusAttr(m) + '>';
      html += m.image
        ? '<img src="' + esc(m.image) + '" alt="' + esc(m.name) + '" onerror="this.outerHTML=\'<div class=&quot;cmp-img-placeholder&quot;>No image yet</div>\'">'
        : '<div class="cmp-img-placeholder">No image yet</div>';
      html += '</div>';
    });
    html += '</div>';

    // Spec rows / sections
    specs.forEach(row => {
      if (row.section) {

          if (maxV > minV && maxV > 0) rankings = parsed.map(v => v / maxV);
        }

        html += '<div class="cmp-row">';

          const raw = (m.specs && m.specs[row.key] != null) ? m.specs[row.key] : '—';

          html += '<div class="cmp-cell cmp-spec"' + statusAttr(m) + gold + '>';
          if (row.label) html += '<div class="cmp-spec-label">' + esc(row.label) + '</div>';
          html += val + '</div>';
        });
        html += '</div>';
      }
    });

    return html;
  }
