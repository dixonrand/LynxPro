<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Lynx Assistant &mdash; Lynx Support</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
:root{--bg:#FFFFFF;--bg-card:#FFFFFF;--bg-section:#EAE0F2;--gold:#E8A800;--ink:#111;--ink-2:#333;--ink-3:#555;--ink-4:#666;--ink-5:#888;--ink-6:#aaa;--nav-bg:#2d004f;--border:#C7C7C7;--border-row:rgba(0,0,0,.16);--purple:#55009C}
[data-theme="warm"]{--bg:#F5EFD6;--bg-card:#FDFAF0;--bg-section:#EDE4BF;--gold:#E8A800;--ink:#111;--ink-2:#333;--ink-3:#555;--ink-4:#666;--ink-5:#888;--ink-6:#aaa;--nav-bg:#1a1a1a;--border:#111;--border-row:rgba(0,0,0,.12);--purple:#55009C}
[data-theme="glass"]{--bg:transparent;--bg-card:rgba(255,255,255,.08);--bg-section:rgba(255,255,255,.1);--gold:#E8A800;--ink:#fff;--ink-2:rgba(255,255,255,.9);--ink-3:rgba(255,255,255,.7);--ink-4:rgba(255,255,255,.6);--ink-5:rgba(255,255,255,.45);--ink-6:rgba(255,255,255,.3);--nav-bg:rgba(0,0,0,.2);--border:rgba(255,255,255,.18);--purple:#9c5cce}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:15px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
[data-theme="glass"] html{background:linear-gradient(180deg,#2080d8 0%,#45a8f0 18%,#1d6820 30%,#3a9535 38%,#c43525 42%,#8a1c0c 100%) fixed;min-height:100vh}
[data-theme="glass"] body{background:transparent}

/* Header */
.hdr{background:var(--nav-bg);border-bottom:3px solid var(--gold);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{display:flex;align-items:center;gap:14px}
.logo img{height:32px;width:auto;display:block}
.logo-divider{width:1px;height:24px;background:rgba(255,255,255,.2)}
.crumbs{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#fff;letter-spacing:.3px;text-transform:uppercase}
.crumb-link{opacity:.55;text-decoration:none;color:inherit;transition:opacity .15s}
.crumb-link:hover{opacity:1}
.crumb-sep{opacity:.35;font-weight:400;font-size:15px}
.crumb-current{opacity:.95}
.hdr-right{display:flex;align-items:center;gap:14px}
.theme-picker{display:flex;align-items:center;gap:6px}
.theme-dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer;transition:transform .15s;padding:0;outline:none}
.theme-dot:hover{transform:scale(1.2)}
.theme-dot.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.hdr-beta{background:var(--gold);color:#111;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:4px 10px;border:1px solid var(--border)}
[data-theme="glass"] .hdr{backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);border-bottom:1px solid rgba(255,255,255,.15)}
[data-theme="glass"] .hdr-beta{background:rgba(232,168,0,.3);border-color:rgba(232,168,0,.5);color:#fff}
[data-theme="glass"] .theme-dot{border-color:rgba(255,255,255,.4)}

/* Chat layout */
.chat-wrap{flex:1;display:flex;flex-direction:column;width:100%;overflow:hidden}

/* Messages area — kept narrow for readability even when the page is wide */
.messages{flex:1;overflow-y:auto;padding:24px 20px;display:flex;flex-direction:column;gap:16px;max-width:820px;width:100%;margin:0 auto}
.msg{display:flex;gap:10px;max-width:85%;animation:msgIn .2s ease}
.msg-user{align-self:flex-end;flex-direction:row-reverse}
.msg-assistant{align-self:flex-start}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.msg-avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.msg-user .msg-avatar{background:var(--gold);color:#111}
.msg-assistant .msg-avatar{background:var(--purple);color:#fff}

.msg-bubble{font-size:14px;line-height:1.6;word-break:break-word}
.msg-user .msg-bubble{background:var(--gold);color:#111;border-radius:14px;border-bottom-right-radius:4px;padding:10px 14px}
/* Assistant: no bubble, no avatar — clean prose directly on the background */
.msg-assistant{max-width:100%;width:100%}
.msg-assistant .msg-avatar{display:none}
.msg-assistant .msg-bubble{background:none;border:none;color:var(--ink-2);font-size:15.5px;line-height:1.72;padding:4px 2px;letter-spacing:.005em}
.msg-assistant .msg-bubble p{margin-bottom:12px}
.msg-bubble p:last-child{margin-bottom:0}
.msg-bubble code{font-family:'JetBrains Mono',monospace;font-size:.92em;background:var(--bg-section);padding:1px 5px;border-radius:3px}
.msg-bubble pre{background:var(--bg-section);padding:12px 14px;border-radius:6px;overflow-x:auto;margin:8px 0;font-size:13px;border:1px solid var(--border-row)}
.msg-bubble pre code{background:none;padding:0}
.msg-bubble ol,.msg-bubble ul{margin:8px 0 12px 22px}
.msg-bubble li{margin-bottom:6px}
.msg-bubble strong{font-weight:700;color:var(--ink)}
/* Headings — modern, minimal hierarchy */
.msg-assistant .msg-bubble h1{font-size:19px;font-weight:700;letter-spacing:-.3px;line-height:1.3;margin:22px 0 10px;color:var(--ink)}
.msg-assistant .msg-bubble h2{font-size:16px;font-weight:700;line-height:1.35;margin:20px 0 8px;color:var(--ink)}
.msg-assistant .msg-bubble h3{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;line-height:1.3;margin:18px 0 6px;color:var(--ink-3)}
.msg-assistant .msg-bubble h4{font-size:13.5px;font-weight:700;margin:14px 0 4px;color:var(--ink-2)}
.msg-assistant .msg-bubble h1:first-child,
.msg-assistant .msg-bubble h2:first-child,
.msg-assistant .msg-bubble h3:first-child,
.msg-assistant .msg-bubble h4:first-child{margin-top:0}
.msg-assistant .msg-bubble hr{border:none;border-top:1px solid var(--border-row);margin:18px 0}
.msg-assistant .msg-bubble blockquote{border-left:3px solid var(--gold);padding:2px 0 2px 12px;margin:10px 0;color:var(--ink-3);font-style:normal}
/* Tables — clean, modern, no chrome */
.msg-assistant .msg-bubble table{border-collapse:collapse;margin:14px 0;font-size:14px;max-width:100%;display:block;overflow-x:auto}
.msg-assistant .msg-bubble thead{border-bottom:1px solid var(--ink-5)}
.msg-assistant .msg-bubble th,.msg-assistant .msg-bubble td{padding:9px 0;text-align:left;vertical-align:top;line-height:1.55}
.msg-assistant .msg-bubble th:not(:last-child),.msg-assistant .msg-bubble td:not(:last-child){padding-right:28px}
.msg-assistant .msg-bubble th{font-weight:700;color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.8px}
.msg-assistant .msg-bubble tbody tr{border-bottom:1px solid var(--border-row)}
.msg-assistant .msg-bubble tbody tr:last-child{border-bottom:none}
/* Caret while typewriting */
.msg-assistant .msg-bubble.typing-active::after{content:'';display:inline-block;width:7px;height:1.05em;background:var(--ink-3);margin-left:2px;vertical-align:-2px;animation:caretBlink 1s steps(2) infinite}
@keyframes caretBlink{50%{opacity:0}}

/* Typing indicator */
.typing{display:flex;gap:4px;padding:12px 16px;align-self:flex-start}
.typing-dot{width:6px;height:6px;border-radius:50%;background:var(--ink-5);animation:typePulse 1.2s ease-in-out infinite}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes typePulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}

/* Welcome state */
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:36px 20px 24px;gap:14px;overflow-y:auto}
.welcome-icon{width:64px;height:64px;background:var(--purple);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.welcome-icon img{width:36px;height:36px}
.welcome h2{font-size:22px;font-weight:800;letter-spacing:-.3px}
.welcome p{font-size:14px;color:var(--ink-4);max-width:480px;line-height:1.55}
.suggestions{display:flex;flex-direction:column;gap:18px;align-items:stretch;width:100%;max-width:1100px;margin:6px auto 0;padding:0 12px}
.sugg-group{display:flex;flex-direction:column;gap:8px}
.sugg-cat{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:var(--ink-4);text-align:left;padding:0 2px}
.sugg-row{display:flex;flex-wrap:wrap;gap:8px}
.suggestion{background:var(--bg-card);border:1px solid var(--border-row);padding:7px 13px;border-radius:20px;font-size:13px;color:var(--ink-3);cursor:pointer;transition:border-color .12s,background .12s,transform .1s;font-family:inherit;text-align:left}
.suggestion:hover{border-color:var(--gold);background:var(--bg-section);color:var(--ink)}
.suggestion:active{transform:scale(.97)}

/* Input area */
.input-area{padding:12px 20px 20px;border-top:1px solid var(--border-row);flex-shrink:0;background:var(--bg)}
[data-theme="glass"] .input-area{background:transparent;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.input-row{display:flex;gap:8px;align-items:flex-end}
.input-box{flex:1;border:2px solid var(--border-row);border-radius:10px;padding:10px 14px;font-family:inherit;font-size:14px;color:var(--ink);background:var(--bg-card);outline:none;resize:none;min-height:44px;max-height:120px;line-height:1.4;transition:border-color .12s}
.input-box:focus{border-color:var(--gold)}
.input-box::placeholder{color:var(--ink-5)}
.send-btn{background:var(--gold);color:#111;border:none;border-radius:10px;padding:10px 18px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;transition:background .12s;min-height:44px;white-space:nowrap}
.send-btn:hover{background:var(--purple);color:#fff}
.send-btn:disabled{opacity:.4;cursor:not-allowed}

/* New chat button */
.new-chat{position:absolute;top:68px;right:16px;background:var(--bg-card);border:1px solid var(--border-row);border-radius:6px;padding:6px 10px;font-size:11px;font-weight:700;color:var(--ink-4);cursor:pointer;font-family:inherit;transition:border-color .12s}
.new-chat:hover{border-color:var(--gold);color:var(--ink)}

@media(max-width:720px){
  .messages{padding:16px 12px}
  .input-area{padding:10px 12px 16px}
  .msg{max-width:92%}
  .welcome h2{font-size:18px}
  .sugg-row{justify-content:flex-start}
}
</style>
<script>
(function(){var t=localStorage.getItem('lynxpro-theme');if(t==='classic'){t='warm';localStorage.setItem('lynxpro-theme','warm');}else if(t==='finishlynx'){t='';localStorage.removeItem('lynxpro-theme');}if(t)document.documentElement.setAttribute('data-theme',t)})();
</script>
</head>
<body>

<div class="hdr">
  <div class="logo">
    <img src="lynx-head-white-200x200.png" alt="Lynx Support" onerror="this.style.display='none'">
    <div class="logo-divider"></div>
    <div class="crumbs">
      <a href="index.html" class="crumb-link">Lynx Support</a>
      <span class="crumb-sep">&rsaquo;</span>
      <span class="crumb-current">Lynx Assistant</span>
    </div>
  </div>
  <div class="hdr-right">
    <div class="theme-picker">
      <button class="theme-dot" data-theme="modern" style="background:#fff" title="Modern"></button>
      <button class="theme-dot" data-theme="warm" style="background:#F5EFD6" title="Warm"></button>
      <button class="theme-dot" data-theme="glass" style="background:linear-gradient(180deg,#4a9ee8,#c04030)" title="Track"></button>
    </div>
    <span class="hdr-beta">In Beta</span>
  </div>
</div>

<button class="new-chat" id="newChat" style="display:none" title="Start over">+ New Chat</button>

<div class="chat-wrap">
  <!-- Welcome screen (shown before first message) -->
  <div class="welcome" id="welcome">
    <div class="welcome-icon">
      <img src="lynx-head-white-200x200.png" alt="" onerror="this.parentNode.textContent='🐱'">
    </div>
    <h2>Lynx Assistant</h2>
    <p>Ask anything about FinishLynx setup, troubleshooting, cameras, software, scoreboards, or timing accessories.</p>
    <div class="suggestions">
      <div class="sugg-group">
        <div class="sugg-cat">Troubleshooting</div>
        <div class="sugg-row">
          <button class="suggestion" data-q="What does &quot;Error aligning camera&quot; mean and how do I fix it?">Error aligning camera</button>
          <button class="suggestion" data-q="My scoreboard says &quot;Running&quot; in FinishLynx but isn't showing data. What's wrong?">Scoreboard not displaying</button>
          <button class="suggestion" data-q="My camera image is blurry and won't focus. What should I check first?">Image is blurry</button>
          <button class="suggestion" data-q="My RadioLynx wireless start isn't triggering. How do I troubleshoot?">RadioLynx not triggering</button>
          <button class="suggestion" data-q="I got an &quot;Invalid code&quot; error on a ResulTV-VDM upgrade. What should I do?">VDM upgrade code &quot;Invalid&quot;</button>
          <button class="suggestion" data-q="The Z: drive isn't visible on my read laptop. How do I fix it?">Z: drive not visible</button>
          <button class="suggestion" data-q="My capture button or spacebar isn't working in FinishLynx. How do I fix it?">Capture button / spacebar</button>
          <button class="suggestion" data-q="A bad Ethernet or PoE cable might be the problem. How do I diagnose it?">Bad Ethernet / PoE cable</button>
          <button class="suggestion" data-q="The splits checkbox is missing in LynxPad. Why?">LynxPad splits missing</button>
          <button class="suggestion" data-q="My IdentiLynx video blacks out during capture. Is it broken?">IdentiLynx video blackout</button>
        </div>
      </div>

      <div class="sugg-group">
        <div class="sugg-cat">Cameras &amp; Hardware</div>
        <div class="sugg-row">
          <button class="suggestion" data-q="How do the EtherLynx Vision PRO X, Vision PRO, and Vision compare? Which should I buy?">Vision PRO X vs PRO vs Vision</button>
          <button class="suggestion" data-q="Compare IdentiLynx HRS, SR-2, and SR. Which video camera should I get?">IdentiLynx HRS vs SR-2 vs SR</button>
          <button class="suggestion" data-q="Compare VeriLynx V30 and V60. Which optical-finish backup is right for me?">VeriLynx V30 vs V60</button>
          <button class="suggestion" data-q="Compare the legacy EtherLynx Fusion, Pro, and 2000+ cameras.">Fusion vs Pro vs 2000+</button>
          <button class="suggestion" data-q="When do I need the CS-C 5mm ring adapter? What's the difference between C-Mount and CS-Mount lenses?">C-Mount vs CS-Mount lenses</button>
          <button class="suggestion" data-q="What do the different camera LED states mean (amber, green, red, flashing)?">Camera LED states</button>
          <button class="suggestion" data-q="My 8-48mm Vision lens is out of focus. What is the silver screw fix?">Silver screw lens fix</button>
          <button class="suggestion" data-q="Why does the Portable LED Display only accept HDMI and not Ethernet?">LED Display HDMI</button>
        </div>
      </div>

      <div class="sugg-group">
        <div class="sugg-cat">Setup &amp; Networking</div>
        <div class="sugg-row">
          <button class="suggestion" data-q="Walk me through a pre-meet day checklist before the first race.">Pre-meet day checklist</button>
          <button class="suggestion" data-q="How do I manually align the camera before the first race?">Manually align the camera</button>
          <button class="suggestion" data-q="What capture mode should I use on IdentiLynx when paired with an EtherLynx camera?">IdentiLynx capture mode</button>
          <button class="suggestion" data-q="How do I set up Multi-User Mode with a second laptop in reader mode during a live race?">Multi-User Mode setup</button>
          <button class="suggestion" data-q="How do I set up TeamViewer for a remote support session?">TeamViewer setup</button>
          <button class="suggestion" data-q="Should I disable Wi-Fi during a TeamViewer session?">Wi-Fi during TeamViewer</button>
          <button class="suggestion" data-q="Walk me through networking setup on Windows 10 or Windows 11 for FinishLynx.">Networking guide</button>
          <button class="suggestion" data-q="How do I add FinishLynx to Windows Firewall correctly?">Add to Windows Firewall</button>
          <button class="suggestion" data-q="How do I set up Automatic Capture Mode (ACM)?">ACM setup</button>
          <button class="suggestion" data-q="When should I set Hardware Type to None?">When to set Hardware Type None</button>
        </div>
      </div>

      <div class="sugg-group">
        <div class="sugg-cat">Software &amp; Plug-ins</div>
        <div class="sugg-row">
          <button class="suggestion" data-q="When should I use FinishLynx Lite vs full FinishLynx?">FinishLynx vs FinishLynx Lite</button>
          <button class="suggestion" data-q="When should I use FieldLynx Lite vs full FieldLynx?">FieldLynx vs FieldLynx Lite</button>
          <button class="suggestion" data-q="Should I use ResulTV or ResulTV-VDM? What are the differences?">ResulTV vs ResulTV-VDM</button>
          <button class="suggestion" data-q="How do I get the latest version of FinishLynx? Are upgrades free?">Software upgrades</button>
          <button class="suggestion" data-q="Where do I download FinishLynx plug-ins?">Where to download plug-ins</button>
          <button class="suggestion" data-q="What is the NCP (Network COM Port) plug-in and do I need to install it?">NCP plugin</button>
          <button class="suggestion" data-q="How do I connect FinishLynx to HyTek? Should I use serial or file sharing?">HyTek integration</button>
          <button class="suggestion" data-q="Which meet management software integrates with FinishLynx?">Meet management options</button>
          <button class="suggestion" data-q="What's the difference between C:\Lynx, C:\LynxLite, and C:\Meets?">File paths explained</button>
          <button class="suggestion" data-q="Does FinishLynx have an API for custom integrations?">FinishLynx has no API</button>
        </div>
      </div>

      <div class="sugg-group">
        <div class="sugg-cat">Files &amp; Workflow</div>
        <div class="sugg-row">
          <button class="suggestion" data-q="What is a .LIF file and how does meet management software use it?">What is a .LIF file?</button>
          <button class="suggestion" data-q="What is a .LSS scoreboard script and where do I find one for my display?">What is a .LSS script?</button>
          <button class="suggestion" data-q="What is Fully Automatic Timing (FAT)?">What is FAT?</button>
          <button class="suggestion" data-q="How do I figure out which way competitors will face in the photo finish image?">Image orientation rule</button>
          <button class="suggestion" data-q="How do I time two events from the same race image in Single Event Mode?">Two events from one image</button>
          <button class="suggestion" data-q="What is LapTime From Image and when do I need it?">LapTime From Image</button>
          <button class="suggestion" data-q="How do I export IdentiLynx video to YouTube or a file?">Export IdentiLynx video</button>
        </div>
      </div>

      <div class="sugg-group">
        <div class="sugg-cat">Packages &amp; Policy</div>
        <div class="sugg-row">
          <button class="suggestion" data-q="Compare the domestic packages: Scholastic, Bronze, Silver, Gold, Platinum, and Diamond. What's in each?">Domestic package comparison</button>
          <button class="suggestion" data-q="Compare the international packages: Competition, Championship, Grand Prix, and their Elite versions.">International packages</button>
          <button class="suggestion" data-q="What packages does Lynx offer for cycling, rowing, speed skating, and cross country?">Other sport packages</button>
          <button class="suggestion" data-q="What is the Lynx loaner and RMA policy for defective hardware?">Loaner / RMA policy</button>
          <button class="suggestion" data-q="How should I format a customer-facing FinishLynx support email?">Customer email format</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Messages (hidden until first message) -->
  <div class="messages" id="messages" style="display:none"></div>
</div>

<div class="input-area">
  <div class="input-row">
    <textarea class="input-box" id="inputBox" placeholder="Ask a question about FinishLynx…" rows="1"></textarea>
    <button class="send-btn" id="sendBtn">Send</button>
  </div>
</div>

<script>
(function(){
  // ============================================================
  // CONFIGURATION — update this URL after deploying the Worker
  // ============================================================
  var WORKER_URL = 'https://lynx-bot.dixonrand2017.workers.dev';

  // Theme switcher
  var saved = localStorage.getItem('lynxpro-theme');if(saved==='finishlynx'){saved=null;localStorage.removeItem('lynxpro-theme');}else if(saved==='classic'){saved='warm';localStorage.setItem('lynxpro-theme','warm');}var cur = saved || 'modern';
  document.querySelectorAll('.theme-dot').forEach(function(dot){
    if(dot.dataset.theme === cur) dot.classList.add('active');
    dot.addEventListener('click', function(){
      var theme = dot.dataset.theme;
      document.documentElement.setAttribute('data-theme', theme === 'modern' ? '' : theme);
      localStorage.setItem('lynxpro-theme', theme);
      document.querySelectorAll('.theme-dot').forEach(function(d){ d.classList.toggle('active', d === dot); });
    });
  });

  var welcomeEl = document.getElementById('welcome');
  var messagesEl = document.getElementById('messages');
  var inputBox = document.getElementById('inputBox');
  var sendBtn = document.getElementById('sendBtn');
  var newChatBtn = document.getElementById('newChat');
  var history = [];  // {role, content}
  var streaming = false;

  // Auto-resize textarea
  inputBox.addEventListener('input', function(){
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });

  // Send on Enter (Shift+Enter for newline)
  inputBox.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      send();
    }
  });

  sendBtn.addEventListener('click', send);

  // Suggestion buttons
  document.querySelectorAll('.suggestion').forEach(function(btn){
    btn.addEventListener('click', function(){
      inputBox.value = btn.dataset.q;
      send();
    });
  });

  // New chat
  newChatBtn.addEventListener('click', function(){
    history = [];
    messagesEl.innerHTML = '';
    messagesEl.style.display = 'none';
    welcomeEl.style.display = '';
    newChatBtn.style.display = 'none';
    inputBox.value = '';
    inputBox.style.height = 'auto';
  });

  function send(){
    var text = inputBox.value.trim();
    if(!text || streaming) return;

    // Switch from welcome to chat
    if(welcomeEl.style.display !== 'none'){
      welcomeEl.style.display = 'none';
      messagesEl.style.display = 'flex';
      newChatBtn.style.display = '';
    }

    // Add user message
    history.push({role:'user', content:text});
    appendMsg('user', text);
    inputBox.value = '';
    inputBox.style.height = 'auto';

    // Check if Worker is configured
    if(!WORKER_URL){
      appendMsg('assistant', 'The Lynx Assistant is not connected yet. To enable it:\n\n1. Deploy the Cloudflare Worker from `support/scripts/cloudflare-worker.js`\n2. Add your Anthropic API key as an environment variable\n3. Paste the Worker URL into the `WORKER_URL` constant in this page\'s script\n\nSee the deployment guide in the repo for details.');
      return;
    }

    callAPI();
  }

  function appendMsg(role, content){
    var div = document.createElement('div');
    div.className = 'msg msg-' + role;
    var avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = role === 'user' ? 'You' : 'Lx';
    var bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerHTML = formatMarkdown(content);
    div.appendChild(avatar);
    div.appendChild(bubble);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function showTyping(){
    var div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typing';
    div.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  function hideTyping(){
    var el = document.getElementById('typing');
    if(el) el.remove();
  }

  function callAPI(){
    streaming = true;
    sendBtn.disabled = true;
    showTyping();

    fetch(WORKER_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        messages: history,
        max_tokens: 2048
      })
    }).then(function(res){
      hideTyping();
      if(!res.ok){
        var msg;
        if(res.status === 429) msg = 'Lynx Assistant is busy right now. Please wait a moment and try again.';
        else if(res.status >= 500) msg = 'Lynx Assistant is temporarily unavailable. Try again shortly.';
        else msg = 'Lynx Assistant could not respond (error ' + res.status + '). Please try again.';
        throw new Error(msg);
      }

      var bubble = appendMsg('assistant', '');
      bubble.classList.add('typing-active');

      // Typewriter pacing: characters arrive from the API in chunks, but we
      // render them at a steady cadence so the response visibly types out.
      var pending = '';      // received from stream, not yet rendered
      var displayed = '';    // currently shown
      var streamDone = false;

      var TICK_MS = 14;            // animation frame interval
      var BASE_CPS = 90;           // ~ characters per second baseline
      var MAX_CATCHUP = 220;       // cap chars/sec when queue grows long

      var typeTimer = setInterval(function(){
        if(pending.length === 0){
          if(streamDone){
            clearInterval(typeTimer);
            bubble.classList.remove('typing-active');
            history.push({role:'assistant', content:displayed});
            streaming = false;
            sendBtn.disabled = false;
          }
          return;
        }
        // Adaptive speed: emit more chars per tick if the queue is backing up
        var perTick = Math.max(1, Math.round(BASE_CPS * TICK_MS / 1000));
        if(pending.length > 80){
          perTick = Math.min(MAX_CATCHUP * TICK_MS / 1000, Math.ceil(pending.length / 18));
        }
        var chunk = pending.slice(0, perTick);
        pending = pending.slice(perTick);
        displayed += chunk;
        bubble.innerHTML = formatMarkdown(displayed);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }, TICK_MS);

      // Read SSE stream and feed deltas into `pending`
      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buffer = '';

      function read(){
        reader.read().then(function(result){
          if(result.done){
            streamDone = true;
            return;
          }
          buffer += decoder.decode(result.value, {stream:true});
          var lines = buffer.split('\n');
          buffer = lines.pop();

          lines.forEach(function(line){
            if(!line.startsWith('data: ')) return;
            var data = line.slice(6).trim();
            if(data === '[DONE]') return;
            try{
              var evt = JSON.parse(data);
              if(evt.type === 'content_block_delta' && evt.delta && evt.delta.text){
                pending += evt.delta.text;
              }
            }catch(e){}
          });
          read();
        }).catch(function(){
          streamDone = true;
        });
      }
      read();

    }).catch(function(err){
      hideTyping();
      var msg = err && err.message ? err.message : 'Something went wrong. Please try again.';
      if(/^(failed to fetch|network|load failed)/i.test(msg)){
        msg = 'Could not reach Lynx Assistant. Check your connection and try again.';
      }
      appendMsg('assistant', msg);
      streaming = false;
      sendBtn.disabled = false;
    });
  }

  // Markdown → HTML (handles headings, hr, blockquotes, bold, italic, code,
  // code blocks, links, ordered/unordered lists, paragraphs)
  function formatMarkdown(md){
    if(!md) return '';
    // Code blocks first so their contents aren't eaten by other rules
    var codeBlocks = [];
    md = md.replace(/```(\w*)\n([\s\S]*?)```/g, function(_, lang, code){
      var i = codeBlocks.length;
      codeBlocks.push('<pre><code>' + esc(code.trim()) + '</code></pre>');
      return '␀CB' + i + '␀';
    });
    // Headings (line-based) — pull out into their own blocks
    md = md.replace(/^(#{1,6})\s+(.+?)\s*#*\s*$/gm, function(_, hashes, text){
      var level = Math.min(hashes.length, 6);
      return '\n\n<h' + level + '>' + text.trim() + '</h' + level + '>\n\n';
    });
    // Horizontal rule
    md = md.replace(/^\s*([-*_])\1{2,}\s*$/gm, '\n\n<hr>\n\n');
    // Inline code
    md = md.replace(/`([^`]+)`/g, function(_, c){ return '<code>' + esc(c) + '</code>'; });
    // Bold (**text**) and italic (*text* / _text_)
    md = md.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    md = md.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    md = md.replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>');
    // Links [text](url)
    md = md.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(_, text, url){
      var safeUrl = /^(https?:|mailto:|#|\/)/.test(url) ? url : '#';
      return '<a href="' + safeUrl + '" target="_blank" rel="noopener">' + text + '</a>';
    });

    // Split into blocks
    var blocks = md.split(/\n\n+/);
    var html = '';
    blocks.forEach(function(block){
      block = block.trim();
      if(!block) return;
      // Already-formatted HTML blocks pass through
      if(/^<(h[1-6]|hr|pre)\b/.test(block) || /^␀CB\d+␀$/.test(block)){
        html += block;
        return;
      }
      // GFM-style table: header row, separator row, then any number of body rows
      var tLines = block.split('\n');
      if(tLines.length >= 2 && tLines[0].indexOf('|') !== -1 &&
         /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(tLines[1])){
        var parseRow = function(line){
          return line.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(function(c){ return c.trim(); });
        };
        var headerCells = parseRow(tLines[0]);
        var bodyRows = tLines.slice(2).filter(function(l){ return l.trim(); }).map(parseRow);
        html += '<table><thead><tr>';
        headerCells.forEach(function(c){ html += '<th>' + c + '</th>'; });
        html += '</tr></thead><tbody>';
        bodyRows.forEach(function(row){
          html += '<tr>';
          row.forEach(function(c){ html += '<td>' + c + '</td>'; });
          html += '</tr>';
        });
        html += '</tbody></table>';
        return;
      }
      // Blockquote: every line starts with >
      if(/^>\s?/.test(block) && block.split('\n').every(function(l){ return /^>\s?/.test(l) || !l.trim(); })){
        var inner = block.split('\n').map(function(l){ return l.replace(/^>\s?/, ''); }).join('\n');
        html += '<blockquote>' + inner.replace(/\n/g, '<br>') + '</blockquote>';
        return;
      }
      // Numbered list
      if(/^\d+[\.\)]\s/.test(block)){
        var items = block.split(/\n(?=\d+[\.\)]\s)/).filter(Boolean);
        html += '<ol>';
        items.forEach(function(li){ html += '<li>' + li.replace(/^\d+[\.\)]\s*/, '').replace(/\n/g,'<br>') + '</li>'; });
        html += '</ol>';
        return;
      }
      // Bullet list
      if(/^[-*]\s/.test(block)){
        var items = block.split(/\n(?=[-*]\s)/).filter(Boolean);
        html += '<ul>';
        items.forEach(function(li){ html += '<li>' + li.replace(/^[-*]\s*/, '').replace(/\n/g,'<br>') + '</li>'; });
        html += '</ul>';
        return;
      }
      // Default paragraph
      html += '<p>' + block.replace(/\n/g, '<br>') + '</p>';
    });

    // Restore code blocks
    html = html.replace(/␀CB(\d+)␀/g, function(_, i){ return codeBlocks[+i]; });
    return html;
  }

  function esc(s){
    return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  }
})();
</script>
</body>
</html>
