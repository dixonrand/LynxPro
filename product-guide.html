<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Product Guide &mdash; Lynx Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
html{color-scheme:light;background:#F5EFD6}
body{background:#F5EFD6;color:#111;font-family:'Inter',sans-serif;font-size:15px;min-height:100vh;display:flex;flex-direction:column}
.hdr{background:#1a1a1a;border-bottom:3px solid #E8A800;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:14px}
.logo img{height:32px;width:auto;display:block}
.logo-divider{width:1px;height:24px;background:rgba(255,255,255,.2)}
.crumbs{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#fff;letter-spacing:.3px;text-transform:uppercase}
.crumb-link{opacity:.55;text-decoration:none;color:inherit;transition:opacity .15s}
.crumb-link:hover{opacity:1}
.crumb-sep{opacity:.35;font-weight:400;font-size:15px}
.crumb-current{opacity:.95}
.hdr-beta{background:#E8A800;color:#111;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:4px 10px;border:1px solid #111}
.wrap{margin:0 auto;padding:16px 24px 28px;width:100%;flex:1}
.cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid #111}
.cat-tab{flex:1 1 0;min-width:0;background:#FDFAF0;border:2px solid #111;color:#111;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:5px 8px;cursor:pointer;transition:transform .12s,box-shadow .12s,background .15s;text-align:center}
.cat-tab:hover{background:#EDE4BF;transform:translateY(-2px);box-shadow:3px 3px 0 #111}
.cat-tab:active{transform:translateY(0);box-shadow:1px 1px 0 #111}
.cat-tab.active{background:#111;color:#FDFAF0;box-shadow:3px 3px 0 #E8A800}
.cat-tab.active:hover{transform:translateY(-2px);box-shadow:4px 4px 0 #E8A800}
.cat-panel{display:none}
.cat-panel.active{display:block}
.sub-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.sub-tab{background:transparent;border:1.5px solid #111;color:#111;font-family:inherit;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:5px 14px;cursor:pointer;transition:background .15s}
.sub-tab:hover{background:#EDE4BF}
.sub-tab.active{background:#111;color:#FDFAF0}
.sub-panel{display:none}
.sub-panel.active{display:block}
footer{border-top:2px solid #111;padding:16px 24px;text-align:center;font-size:11px;color:#888}
footer span{color:#555;font-weight:600}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">
    <img src="lynx-head-white-200x200.png" alt="Lynx Pro" onerror="this.style.display='none'">
    <div class="logo-divider"></div>
    <div class="crumbs">
      <a href="index.html" class="crumb-link">Lynx Pro</a>
      <span class="crumb-sep">&rsaquo;</span>
      <span class="crumb-current">Product Guide</span>
    </div>
  </div>
  <span class="hdr-beta">In Beta</span>
</div>

<div class="wrap">

  <div class="cat-tabs">
    <button class="cat-tab active" data-cat="etherlynx">EtherLynx Cameras</button>
    <button class="cat-tab" data-cat="identilynx">IdentiLynx Cameras</button>
    <button class="cat-tab" data-cat="lenses">Lenses</button>
    <button class="cat-tab" data-cat="upgrades">Camera Upgrades</button>
    <button class="cat-tab" data-cat="scoreboards">Scoreboards &amp; Displays</button>
    <button class="cat-tab" data-cat="start">Start Systems</button>
    <button class="cat-tab" data-cat="reactime">ReacTime</button>
    <button class="cat-tab" data-cat="verilynx">VeriLynx</button>
    <button class="cat-tab" data-cat="accessories">Accessories</button>
  </div>

  <div class="cat-panel active" data-cat="etherlynx">
    <div class="sub-tabs" data-parent="etherlynx">
      <button class="sub-tab active" data-sub="all">All</button>
      <button class="sub-tab" data-sub="available">Available</button>
    </div>
    <div class="sub-panel active" data-parent="etherlynx" data-sub="all"></div>
    <div class="sub-panel" data-parent="etherlynx" data-sub="available"></div>
  </div>
  <div class="cat-panel" data-cat="identilynx"></div>
  <div class="cat-panel" data-cat="lenses"></div>
  <div class="cat-panel" data-cat="upgrades"></div>
  <div class="cat-panel" data-cat="scoreboards"></div>
  <div class="cat-panel" data-cat="start"></div>
  <div class="cat-panel" data-cat="reactime"></div>
  <div class="cat-panel" data-cat="verilynx"></div>
  <div class="cat-panel" data-cat="accessories"></div>

</div>

<footer><span>Lynx Pro</span> &mdash; Product Guide</footer>

<script>
(function(){
  const tabs = document.querySelectorAll('.cat-tab');
  const panels = document.querySelectorAll('.cat-panel');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const cat = tab.dataset.cat;
      tabs.forEach(t => t.classList.toggle('active', t === tab));
      panels.forEach(p => p.classList.toggle('active', p.dataset.cat === cat));
    });
  });

  document.querySelectorAll('.sub-tabs').forEach(bar => {
    const parent = bar.dataset.parent;
    const subTabs = bar.querySelectorAll('.sub-tab');
    const subPanels = document.querySelectorAll('.sub-panel[data-parent="' + parent + '"]');
    subTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const sub = tab.dataset.sub;
        subTabs.forEach(t => t.classList.toggle('active', t === tab));
        subPanels.forEach(p => p.classList.toggle('active', p.dataset.sub === sub));
      });
    });
  });
})();
</script>

</body>
</html>
