<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Product Guide &mdash; Lynx Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
html{color-scheme:light;background:#F5EFD6}
body{background:#F5EFD6;color:#111;font-family:'Inter',sans-serif;font-size:15px;min-height:100vh;display:flex;flex-direction:column}
.hdr{background:#1a1a1a;border-bottom:3px solid #E8A800;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:14px}
.logo img{height:32px;width:auto;display:block}
.logo-divider{width:1px;height:24px;background:rgba(255,255,255,.2)}
.crumbs{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#fff;letter-spacing:.3px;text-transform:uppercase}
.crumb-link{opacity:.55;text-decoration:none;color:inherit;transition:opacity .15s}
.crumb-link:hover{opacity:1}
.crumb-sep{opacity:.35;font-weight:400;font-size:15px}
.crumb-current{opacity:.95}
.hdr-beta{background:#E8A800;color:#111;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:4px 10px;border:1px solid #111}
.wrap{margin:0 auto;padding:16px 16px 28px;width:100%;flex:1}
.cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid #111}
.cat-tab{flex:1 1 0;min-width:0;background:#FDFAF0;border:2px solid #111;color:#111;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:5px 8px;cursor:pointer;transition:transform .12s,box-shadow .12s,background .15s;text-align:center}
.cat-tab:hover{background:#EDE4BF;transform:translateY(-2px);box-shadow:3px 3px 0 #111}
.cat-tab:active{transform:translateY(0);box-shadow:1px 1px 0 #111}
.cat-tab.active{background:#111;color:#FDFAF0;box-shadow:3px 3px 0 #E8A800}
.cat-tab.active:hover{transform:translateY(-2px);box-shadow:4px 4px 0 #E8A800}
.cat-panel{display:none}
.cat-panel.active{display:block}
.sub-tabs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.sub-tab{background:transparent;border:1.5px solid #111;color:#111;font-family:inherit;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:5px 14px;cursor:pointer;transition:background .15s}
.sub-tab:hover{background:#EDE4BF}
.sub-tab.active{background:#111;color:#FDFAF0}
.sub-panel{display:none}
.sub-panel.active{display:block}
.cmp-empty{padding:44px 24px;text-align:center;color:#888;font-size:13px;background:#FDFAF0;border:2px dashed #111}
.compare{background:#FDFAF0;border:2px solid #111;overflow:hidden}
.cmp-row{display:flex;align-items:stretch}
.cmp-row + .cmp-row,.cmp-section + .cmp-row,.cmp-row + .cmp-section{border-top:1px solid rgba(0,0,0,.12)}
.cmp-cell{flex:1 1 0;min-width:0;max-width:100%;background:#FDFAF0;padding:12px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;border-left:1px solid rgba(0,0,0,.08);transition:max-width .55s cubic-bezier(.4,0,.2,1),padding .55s cubic-bezier(.4,0,.2,1),opacity .3s ease,border-left-width .55s cubic-bezier(.4,0,.2,1)}
.cmp-row > .cmp-cell:first-child{border-left:0}
.cmp-header{padding:16px 10px 14px}
.cmp-model-num{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:800;letter-spacing:.8px;color:#555;text-transform:uppercase;margin-bottom:6px;white-space:nowrap}
.cmp-name{font-size:13px;font-weight:800;letter-spacing:-.2px;color:#111;line-height:1.2}
.cmp-tagline{font-size:11px;color:#666;margin-top:5px;line-height:1.45}
.cmp-status{display:inline-block;margin-top:7px;font-size:8px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:2px 6px;border:1.5px solid #111;white-space:nowrap}
.cmp-status.available{background:#F5C518;color:#111}
.cmp-status.retired{background:#111;color:#FDFAF0}
.cmp-img-cell{padding:14px 8px;min-height:120px}
.cmp-img-cell img{max-width:100%;max-height:110px;width:auto;height:auto;display:block}
.cmp-img-placeholder{font-size:9px;color:#aaa;font-style:italic;letter-spacing:.3px;text-transform:uppercase}
.cmp-section{background:#EDE4BF;padding:8px 14px;font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#555;text-align:left}
.cmp-spec{font-size:12px;line-height:1.45;color:#333;min-height:46px}
.compare[data-filter="available"] .cmp-cell[data-status="retired"]{max-width:0;padding-left:0;padding-right:0;opacity:0;border-left-width:0;pointer-events:none}
footer{border-top:2px solid #111;padding:16px 24px;text-align:center;font-size:11px;color:#888}
footer span{color:#555;font-weight:600}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">
    <img src="lynx-head-white-200x200.png" alt="Lynx Pro" onerror="this.style.display='none'">
    <div class="logo-divider"></div>
    <div class="crumbs">
      <a href="index.html" class="crumb-link">Lynx Pro</a>
      <span class="crumb-sep">&rsaquo;</span>
      <span class="crumb-current">Product Guide</span>
    </div>
  </div>
  <span class="hdr-beta">In Beta</span>
</div>

<div class="wrap">

  <div class="cat-tabs">
    <button class="cat-tab active" data-cat="etherlynx">EtherLynx Cameras</button>
    <button class="cat-tab" data-cat="identilynx">IdentiLynx Cameras</button>
    <button class="cat-tab" data-cat="lenses">Lenses</button>
    <button class="cat-tab" data-cat="upgrades">Camera Upgrades</button>
    <button class="cat-tab" data-cat="scoreboards">Scoreboards &amp; Displays</button>
    <button class="cat-tab" data-cat="start">Start Systems</button>
    <button class="cat-tab" data-cat="reactime">ReacTime</button>
    <button class="cat-tab" data-cat="verilynx">VeriLynx</button>
    <button class="cat-tab" data-cat="accessories">Accessories</button>
  </div>

  <div class="cat-panel active" data-cat="etherlynx">
    <div class="sub-tabs" data-parent="etherlynx">
      <button class="sub-tab active" data-sub="all">All</button>
      <button class="sub-tab" data-sub="available">Available</button>
    </div>
    <div class="compare" data-parent="etherlynx" data-filter="all"></div>
  </div>
  <div class="cat-panel" data-cat="identilynx"></div>
  <div class="cat-panel" data-cat="lenses"></div>
  <div class="cat-panel" data-cat="upgrades"></div>
  <div class="cat-panel" data-cat="scoreboards"></div>
  <div class="cat-panel" data-cat="start"></div>
  <div class="cat-panel" data-cat="reactime"></div>
  <div class="cat-panel" data-cat="verilynx"></div>
  <div class="cat-panel" data-cat="accessories"></div>

</div>

<footer><span>Lynx Pro</span> &mdash; Product Guide</footer>

<script>
(function(){
  // ----- EtherLynx Cameras data -----
  // Add spec rows here in the order they should appear in the comparison.
  // Use {section:'Name'} to insert a section header row that spans all columns.
  // Use {key:'someKey'} to add a spec row pulling m.specs.someKey from each model.
  const EC_SPECS = [
    // Example:
    // {section:'Imaging'},
    // {key:'frameRate'},
    // {key:'sensor'},
    // {section:'Interface'},
    // {key:'connection'},
  ];

  // Each model: { modelNumber, name, tagline, image, status:'available'|'retired', specs:{...} }
  const EC_MODELS = [
    { modelNumber: '5L100', name: 'EtherLynx 2000',               status: 'retired',   image: 'EtherLynx%202000.png' },
    { modelNumber: '5L200', name: 'EtherLynx 2000',               status: 'retired',   image: 'EtherLynx%202000.png' },
    { modelNumber: '5L300', name: 'EtherLynx Professional',       status: 'retired',   image: 'EtherLynx%202000.png' },
    { modelNumber: '5L400', name: 'EtherLynx Fusion',             status: 'retired',   image: 'EtherLynx%202000.png' },
    { modelNumber: '5L410', name: 'EtherLynx Scholastic',         status: 'retired',   image: 'EtherLynx%202000.png' },
    { modelNumber: '5L420', name: 'EtherLynx 2000+',              status: 'retired',   image: 'EtherLynx%202000.png' },
    { modelNumber: '5L510', name: 'EtherLynx Vision Scholastic',  status: 'available', image: 'EtherLynx%20Vision.png' },
    { modelNumber: '5L500', name: 'EtherLynx Vision',             status: 'available', image: 'EtherLynx%20Vision.png' },
    { modelNumber: '5L600', name: 'EtherLynx Vision Pro',         status: 'available', image: 'EtherLynx%20Vision%20Pro.png' },
    { modelNumber: '5L700', name: 'EtherLynx Vision Pro X',       status: 'available', image: 'EtherLynx%20Vision%20Pro%20X.png' },
  ];

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function statusAttr(m){
    return m.status ? ' data-status="' + esc(m.status) + '"' : '';
  }

  function buildCompare(models, specs){
    if (!models.length) return '<div class="cmp-empty">No models to show yet.</div>';
    let html = '';

    // Header row: model number, name, tagline, status badge
    html += '<div class="cmp-row">';
    models.forEach(m => {
      html += '<div class="cmp-cell cmp-header"' + statusAttr(m) + '>';
      if (m.modelNumber) html += '<div class="cmp-model-num">' + esc(m.modelNumber) + '</div>';
      html += '<div class="cmp-name">' + esc(m.name) + '</div>';
      if (m.tagline) html += '<div class="cmp-tagline">' + esc(m.tagline) + '</div>';
      if (m.status) html += '<span class="cmp-status ' + esc(m.status) + '">' + esc(m.status) + '</span>';
      html += '</div>';
    });
    html += '</div>';

    // Image row
    html += '<div class="cmp-row">';
    models.forEach(m => {
      html += '<div class="cmp-cell cmp-img-cell"' + statusAttr(m) + '>';
      html += m.image
        ? '<img src="' + esc(m.image) + '" alt="' + esc(m.name) + '" onerror="this.outerHTML=\'<div class=&quot;cmp-img-placeholder&quot;>No image yet</div>\'">'
        : '<div class="cmp-img-placeholder">No image yet</div>';
      html += '</div>';
    });
    html += '</div>';

    // Spec rows / sections
    specs.forEach(row => {
      if (row.section) {
        html += '<div class="cmp-section">' + esc(row.section) + '</div>';
      } else {
        html += '<div class="cmp-row">';
        models.forEach(m => {
          const val = (m.specs && m.specs[row.key] != null) ? m.specs[row.key] : '—';
          html += '<div class="cmp-cell cmp-spec"' + statusAttr(m) + '>' + esc(val) + '</div>';
        });
        html += '</div>';
      }
    });

    return html;
  }

  // Initial render for EtherLynx Cameras
  const ecCompare = document.querySelector('.compare[data-parent="etherlynx"]');
  if (ecCompare) ecCompare.innerHTML = buildCompare(EC_MODELS, EC_SPECS);

  // ----- Tab wiring -----
  const tabs = document.querySelectorAll('.cat-tab');
  const panels = document.querySelectorAll('.cat-panel');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const cat = tab.dataset.cat;
      tabs.forEach(t => t.classList.toggle('active', t === tab));
      panels.forEach(p => p.classList.toggle('active', p.dataset.cat === cat));
    });
  });

  document.querySelectorAll('.sub-tabs').forEach(bar => {
    const parent = bar.dataset.parent;
    const subTabs = bar.querySelectorAll('.sub-tab');
    const subPanels = document.querySelectorAll('.sub-panel[data-parent="' + parent + '"]');
    const compareBoxes = document.querySelectorAll('.compare[data-parent="' + parent + '"]');
    subTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const sub = tab.dataset.sub;
        subTabs.forEach(t => t.classList.toggle('active', t === tab));
        subPanels.forEach(p => p.classList.toggle('active', p.dataset.sub === sub));
        compareBoxes.forEach(c => { c.dataset.filter = sub; });
      });
    });
  });
})();
</script>

</body>
</html>
