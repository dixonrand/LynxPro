<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Document Library &mdash; Lynx Support</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
:root{--bg:#FFFFFF;--bg-card:#FFFFFF;--bg-section:#EAE0F2;--gold:#E8A800;--ink:#111;--ink-2:#333;--ink-3:#555;--ink-4:#666;--ink-5:#888;--ink-6:#aaa;--nav-bg:#2d004f;--border:#C7C7C7;--border-row:rgba(0,0,0,.16);--purple:#55009C}
[data-theme="warm"]{--bg:#F5EFD6;--bg-card:#FDFAF0;--bg-section:#EDE4BF;--gold:#E8A800;--ink:#111;--ink-2:#333;--ink-3:#555;--ink-4:#666;--ink-5:#888;--ink-6:#aaa;--nav-bg:#1a1a1a;--border:#111;--border-row:rgba(0,0,0,.12);--purple:#55009C}
html{background:var(--bg)}body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:15px;min-height:100vh;display:flex;flex-direction:column}
.hdr{background:var(--nav-bg);border-bottom:3px solid var(--gold);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:14px}
.logo img{height:32px;width:auto;display:block}
.logo-divider{width:1px;height:24px;background:rgba(255,255,255,.2)}
.crumbs{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#fff;letter-spacing:.3px;text-transform:uppercase}
.crumb-link{opacity:.55;text-decoration:none;color:inherit;transition:opacity .15s}
.crumb-link:hover{opacity:1}
.crumb-sep{opacity:.35;font-weight:400;font-size:15px}
.crumb-current{opacity:.95}
.hdr-right{display:flex;align-items:center;gap:14px}
.theme-picker{display:flex;align-items:center;gap:6px}
.theme-dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer;transition:transform .15s;padding:0;outline:none}
.theme-dot:hover{transform:scale(1.2)}
.theme-dot.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.hdr-beta{background:var(--gold);color:#111;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:4px 10px;border:1px solid var(--border)}

/* Layout */
.wrap{max-width:1200px;margin:0 auto;padding:20px 24px 48px;width:100%;flex:1}
.page-header{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.page-title{font-size:28px;font-weight:800;letter-spacing:-.5px}
.doc-count{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink-5)}

/* Search/filter bar */
.filter-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.filter-input{flex:1;min-width:200px;background:var(--bg-card);border:2px solid var(--border);padding:8px 14px;font-family:inherit;font-size:14px;color:var(--ink);outline:none;transition:border-color .15s}
.filter-input:focus{border-color:var(--gold)}
.filter-input::placeholder{color:var(--ink-5)}

/* Type filter pills */
.type-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.type-pill{background:var(--bg-card);border:1.5px solid var(--border);color:var(--ink);font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:5px 12px;cursor:pointer;transition:background .12s}
.type-pill:hover{background:var(--bg-section)}
.type-pill.active{background:var(--ink);color:var(--bg-card)}
.type-pill .pill-count{font-family:'JetBrains Mono',monospace;font-size:10px;opacity:.6;margin-left:4px}

/* Category section */
.cat-section{margin-bottom:28px}
.cat-header{display:flex;align-items:center;justify-content:space-between;padding-bottom:8px;margin-bottom:12px;border-bottom:2px solid var(--border)}
.cat-name{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-5)}
.cat-count{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-6)}

/* Doc entry */
.doc-entry{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;background:var(--bg-card);border:1px solid var(--border-row);margin-bottom:6px;text-decoration:none;color:var(--ink);transition:border-color .12s,background .12s}
.doc-entry:hover{border-color:var(--gold);background:var(--bg-section)}
.doc-type-badge{flex-shrink:0;font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:3px 7px;border:1.5px solid var(--border);background:var(--bg-section);color:var(--ink-3);min-width:36px;text-align:center}
.doc-type-badge.video{background:#c62828;color:#fff;border-color:#c62828}
.doc-info{flex:1;min-width:0}
.doc-title{font-size:14px;font-weight:700;color:var(--ink);line-height:1.3;margin-bottom:2px}
.doc-meta{font-size:11px;color:var(--ink-5);line-height:1.4}
.doc-use{font-size:12px;color:var(--ink-4);line-height:1.4;margin-top:3px}

/* Empty state */
.empty-state{text-align:center;padding:48px 24px;color:var(--ink-5);font-size:14px}

/* Footer */
footer{border-top:2px solid var(--border);padding:16px 24px;text-align:center;font-size:11px;color:var(--ink-5)}
footer span{color:var(--ink-3);font-weight:600}


@media(max-width:720px){
  .wrap{padding:16px 12px 32px}
  .page-title{font-size:22px}
  .filter-bar{flex-direction:column}
  .filter-input{min-width:0;width:100%}
}
</style>
<script>
(function(){var t=localStorage.getItem('lynxpro-theme');if(t==='classic'){t='warm';localStorage.setItem('lynxpro-theme','warm');}else if(t==='finishlynx'||t==='glass'){t='';localStorage.removeItem('lynxpro-theme');}if(t)document.documentElement.setAttribute('data-theme',t)})();
</script>
</head>
<body>

<div class="hdr">
  <div class="logo">
    <img src="lynx-head-white-200x200.png" alt="Lynx Support" onerror="this.style.display='none'">
    <div class="logo-divider"></div>
    <div class="crumbs">
      <a href="index.html" class="crumb-link">Lynx Support</a>
      <span class="crumb-sep">&rsaquo;</span>
      <span class="crumb-current">Document Library</span>
    </div>
  </div>
  <div class="hdr-right">
    <div class="theme-picker">
      <button class="theme-dot" data-theme="modern" style="background:#fff" title="Modern"></button>
      <button class="theme-dot" data-theme="warm" style="background:#F5EFD6" title="Warm"></button>
    </div>
    <span class="hdr-beta">In Beta</span>
  </div>
</div>

<div class="wrap">
  <div class="page-header">
    <h1 class="page-title">Document Library</h1>
    <span class="doc-count" id="docCount"></span>
  </div>

  <div class="filter-bar">
    <input class="filter-input" type="text" id="filterInput" placeholder="Search docs by title, category, or keyword…">
  </div>

  <div class="type-filters" id="typeFilters"></div>

  <div id="docList"></div>
</div>

<footer><span>Lynx Support</span> &mdash; Document Library</footer>

<script>
(function(){
  // Theme switcher
  var saved = localStorage.getItem('lynxpro-theme');if(saved==='finishlynx'){saved=null;localStorage.removeItem('lynxpro-theme');}else if(saved==='classic'){saved='warm';localStorage.setItem('lynxpro-theme','warm');}var cur = saved || 'modern';
  document.querySelectorAll('.theme-dot').forEach(function(dot){
    if(dot.dataset.theme === cur) dot.classList.add('active');
    dot.addEventListener('click', function(){
      var theme = dot.dataset.theme;
      document.documentElement.setAttribute('data-theme', theme === 'modern' ? '' : theme);
      localStorage.setItem('lynxpro-theme', theme);
      document.querySelectorAll('.theme-dot').forEach(function(d){ d.classList.toggle('active', d === dot); });
    });
  });

  // Load and render resources
  var allDocs = [];
  var activeType = 'all';

  fetch('support/data/resources.json')
    .then(function(r){ return r.json(); })
    .then(function(data){
      allDocs = data;
      buildTypeFilters();
      render();
    });

  var filterInput = document.getElementById('filterInput');
  filterInput.addEventListener('input', render);

  function buildTypeFilters(){
    var counts = {};
    allDocs.forEach(function(d){
      counts[d.type] = (counts[d.type]||0) + 1;
    });
    var container = document.getElementById('typeFilters');
    var html = '<button class="type-pill active" data-type="all">All<span class="pill-count">' + allDocs.length + '</span></button>';
    var order = ['datasheet','qsg','manual','brochure','video','guide','misc'];
    order.forEach(function(t){
      if(!counts[t]) return;
      var label = t === 'qsg' ? 'QSG' : t === 'misc' ? 'Other' : t.charAt(0).toUpperCase() + t.slice(1);
      html += '<button class="type-pill" data-type="'+t+'">'+label+'<span class="pill-count">'+counts[t]+'</span></button>';
    });
    container.innerHTML = html;
    container.querySelectorAll('.type-pill').forEach(function(pill){
      pill.addEventListener('click', function(){
        activeType = pill.dataset.type;
        container.querySelectorAll('.type-pill').forEach(function(p){ p.classList.toggle('active', p === pill); });
        render();
      });
    });
  }

  function render(){
    var q = filterInput.value.toLowerCase().trim();
    var filtered = allDocs.filter(function(d){
      if(activeType !== 'all' && d.type !== activeType) return false;
      if(!q) return true;
      return (d.title + ' ' + d.category + ' ' + d.subcategory + ' ' + (d.use||'')).toLowerCase().indexOf(q) !== -1;
    });

    document.getElementById('docCount').textContent = 'Showing ' + filtered.length + ' of ' + allDocs.length + ' docs';

    if(!filtered.length){
      document.getElementById('docList').innerHTML = '<div class="empty-state">No documents match your search.</div>';
      return;
    }

    // Group by category
    var groups = {};
    var catOrder = [];
    filtered.forEach(function(d){
      if(!groups[d.category]){
        groups[d.category] = [];
        catOrder.push(d.category);
      }
      groups[d.category].push(d);
    });

    var html = '';
    catOrder.forEach(function(cat){
      var docs = groups[cat];
      html += '<div class="cat-section">';
      html += '<div class="cat-header"><span class="cat-name">'+esc(cat)+'</span><span class="cat-count">'+docs.length+'</span></div>';
      docs.forEach(function(d){
        var isVideo = d.type === 'video';
        var badgeClass = isVideo ? 'doc-type-badge video' : 'doc-type-badge';
        var label = d.type === 'qsg' ? 'QSG' : d.type === 'misc' ? 'DOC' : d.type.toUpperCase().slice(0,4);
        if(d.type === 'datasheet') label = 'DATA';
        if(d.type === 'manual') label = 'MAN';
        if(d.type === 'brochure') label = 'BRCH';
        if(d.type === 'guide') label = 'GUIDE';
        if(d.type === 'video') label = 'VID';

        var meta = esc(cat);
        if(d.subcategory) meta += ' &rsaquo; ' + esc(d.subcategory);

        html += '<a class="doc-entry" href="'+esc(d.url)+'" target="_blank" rel="noopener">';
        html += '<span class="'+badgeClass+'">'+label+'</span>';
        html += '<div class="doc-info">';
        html += '<div class="doc-title">'+esc(d.title)+'</div>';
        html += '<div class="doc-meta">'+meta+'</div>';
        if(d.use) html += '<div class="doc-use">'+esc(d.use)+'</div>';
        html += '</div></a>';
      });
      html += '</div>';
    });

    document.getElementById('docList').innerHTML = html;
  }

  function esc(s){
    return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  }
})();
</script>
<link rel="stylesheet" href="support/assets/lynx-assistant-widget.css">
<script src="support/assets/lynx-assistant-widget.js" defer></script>
</body>
</html>
